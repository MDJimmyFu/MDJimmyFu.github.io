        /* 隱藏捲軸但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .chart-container {
            position: relative; 
            width: 100%; 
            max-width: 300px; 
            margin-left: auto; 
            margin-right: auto; 
            height: 200px;
        }

        /* 動畫效果 */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-item {
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-item.active {
            color: #1e3a8a; /* blue-900 */
        }
        .nav-item.active i {
            transform: translateY(-2px);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #1e3a8a;
            border-radius: 50%;
        }
        
        /* Glassmorphism for header */
        .glass-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            overflow: hidden;
        }
        .glass-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 60%);
            animation: pulse 10s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        .modal-active {
            display: flex !important;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-content {
            background-color: #fff;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;

            display: flex;
            flex-direction: column;

        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');

            const container = document.getElementById('app-content');
            container.innerHTML = '';
            container.classList.remove('fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-in');

            if (tabId === 'itinerary') renderItinerary(container);
            else if (tabId === 'wallet') renderWallet(container);
            else if (tabId === 'guide') renderGuide(container);
            else if (tabId === 'care') renderCare(container);
            else if (tabId === 'language') renderLanguage(container);
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("Copy");
            textArea.remove();
            
            const toast = document.createElement('div');
            toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-800/90 text-white px-4 py-3 rounded-lg shadow-xl z-[60] text-sm font-medium flex items-center gap-2 fade-in';
            toast.innerHTML = '<i class="fas fa-check-circle text-green-400"></i> <span>已複製到剪貼簿</span>';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        function showSpotDetail(key) {
            const spot = spotDetails[key];
            if (!spot) {
                openMap(key); 
                return;
            }

            document.getElementById('modalTitle').innerText = spot.name;
            document.getElementById('modalDesc').innerText = spot.desc;
            document.getElementById('modalTag').innerText = spot.tag;
            
            // Image Logic
            const imgEl = document.getElementById('modalImg');
            const iconContainer = document.getElementById('modalIconContainer');
            
            // Try to set image if available
            // Here we use a placeholder service with keywords as we cannot fetch real images dynamically in this offline-ready file
            // Unless we hardcode specific URLs. For this example, let's use a keyword placeholder.
            // Note: In a real production app, these would be hosted assets.
            
            if (spot.image && spot.image !== "") {
                imgEl.src = spot.image;
                imgEl.classList.remove('hidden');
                iconContainer.classList.add('hidden');
            } else {
                // Fallback to Icon if no image
                const iconClass = spot.icon ? `fas ${spot.icon}` : 'fas fa-map-marker-alt';
                document.getElementById('modalIconBg').className = `${iconClass} text-6xl opacity-50`;
                imgEl.classList.add('hidden');
                iconContainer.classList.remove('hidden');
            }

            // Note
            const noteBox = document.getElementById('modalNoteBox');
            if (spot.note) {
                document.getElementById('modalNote').innerText = spot.note;
                noteBox.classList.remove('hidden');
            } else {
                noteBox.classList.add('hidden');
            }

            // Map Button
            const query = spot.query || spot.name;
            const btn = document.getElementById('modalMapBtn');
            btn.onclick = () => openMap(query);

            // Show Modal
            document.getElementById('spotModal').classList.add('modal-active');
        }

        function closeSpotModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('spotModal').classList.remove('modal-active');
        }

        function openMap(query) {
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');

        // --- Chart.js ---
        function initChart() {
            const ctx = document.getElementById('pacingChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: pacingData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.label + ': ' + context.raw + '%';
                                }
                            }
                        }
                    },
                    cutout: '75%',
                    borderWidth: 0,
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
