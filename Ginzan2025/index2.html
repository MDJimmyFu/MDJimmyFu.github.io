            });

            textArea.style.top = "0";

                    </div>

                    {expandedDay === item.day && (
                      <div className="border-t border-gray-200 bg-gray-50 p-4 space-y-4">
                        {item.details.map((detail, idx) => (
                          <div key={idx} className="flex gap-3">
                            <div className="w-12 text-sm font-mono font-semibold text-gray-500 pt-0.5 shrink-0">
                              {detail.time}
                            </div>
                            <div className="flex-1">
                              <div className="flex items-start gap-2">
                                <div className="mt-0.5 text-gray-400 shrink-0">
                                  {detail.type === 'flight' && <Plane className="w-3.5 h-3.5" />}
                                  {detail.type === 'train' && <Train className="w-3.5 h-3.5" />}
                                  {detail.type === 'car' && <Car className="w-3.5 h-3.5" />}
                                  {detail.type === 'hotel' && <Moon className="w-3.5 h-3.5" />}
                                  {detail.type === 'food' && <Utensils className="w-3.5 h-3.5" />}
                                  {detail.type === 'medical' && <Activity className="w-3.5 h-3.5 text-red-500" />}
                                  {detail.type === 'sight' && <Sun className="w-3.5 h-3.5" />}
                                  {detail.type === 'info' && <Info className="w-3.5 h-3.5" />}
                                  {detail.type === 'bus' && <BusIcon className="w-3.5 h-3.5" />}
                                  {detail.type === 'transport' && <Car className="w-3.5 h-3.5" />}
                                </div>
                                <div className="text-gray-800 text-sm">{detail.activity}</div>
                              </div>
                              {detail.location && (
                                <button 
                                  onClick={(e) => { e.stopPropagation(); openMap(detail.location); }}
                                  className="mt-1 flex items-center gap-1 text-xs text-blue-600 hover:underline"
                                >
                                  <MapPin className="w-2.5 h-2.5" /> 導航
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          );
        };

        const TransportView = () => (
          <div className="space-y-6 pb-20 animate-fadeIn">
            <div>
              <h2 className="text-2xl font-bold text-gray-800 mb-4 px-2">交通資訊</h2>
              <div className="space-y-3">
                {transportData.map((item, index) => (
                  <Card key={index} className="flex gap-4">
                    <div className="p-2 bg-blue-50 rounded-lg h-fit text-blue-600">
                      {item.icon}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex justify-between items-start">
                        <h3 className="font-bold text-gray-800 truncate">{item.title}</h3>
                        <span className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 whitespace-nowrap">{item.date}</span>
                      </div>
                      <p className="text-sm text-gray-600 mt-1">{item.detail}</p>
                      <div className="mt-2 flex flex-wrap gap-2">
                        {item.note && (
                          <span className="inline-flex items-center gap-1 text-xs bg-orange-50 text-orange-700 px-2 py-1 rounded border border-orange-100">
                            <Info className="w-2.5 h-2.5" /> {item.note}
                          </span>
                        )}
                        {item.seats && (
                          <span className="inline-flex items-center gap-1 text-xs bg-green-50 text-green-700 px-2 py-1 rounded border border-green-100">
                            <Utensils className="w-2.5 h-2.5" /> {item.seats}
                          </span>
                        )}
                      </div>
                    </div>
                  </Card>
                ))}
              </div>
            </div>

            <div>
              <h2 className="text-2xl font-bold text-gray-800 mb-4 px-2">住宿資訊</h2>
              <div className="space-y-3">
                {hotelsData.map((hotel, index) => (
                  <Card key={index} className="flex flex-col gap-2">
                    <div className="flex justify-between items-start">
                      <h3 className="font-bold text-gray-800">{hotel.name}</h3>
                      <span className="text-xs text-gray-500">{hotel.date}</span>
                    </div>
                    <div className="flex items-center gap-2 text-sm text-gray-600">
                      <MapPin className="w-3.5 h-3.5 shrink-0" />
                      <span className="truncate">{hotel.address}</span>
                    </div>
                    <div className="flex items-center gap-2 text-sm text-gray-600">
                      <span className="font-mono text-xs bg-gray-100 px-1.5 py-0.5 rounded">ID: {hotel.resId}</span>
                      <button onClick={() => copyToClipboard(hotel.resId)} className="text-gray-400 hover:text-blue-500">
                        <Copy className="w-3 h-3" />
                      </button>
                    </div>
                    <div className="grid grid-cols-2 gap-2 mt-1">
                      <button 
                        onClick={() => openMap(hotel.name)}
                        className="flex items-center justify-center gap-1 py-1.5 bg-blue-50 text-blue-600 rounded text-sm font-medium"
                      >
                        <MapPin className="w-3.5 h-3.5" /> 導航
                      </button>
                      <button 
                         onClick={() => copyToClipboard(hotel.address)}
                         className="flex items-center justify-center gap-1 py-1.5 bg-gray-50 text-gray-600 rounded text-sm font-medium"
                      >
                        <Copy className="w-3.5 h-3.5" /> 複製地址
                      </button>
                    </div>
                  </Card>
                ))}
              </div>
            </div>
          </div>
        );

        const SpotsView = () => {
          const [selectedSpot, setSelectedSpot] = useState(null);

          return (
            <div className="space-y-6 pb-20 animate-fadeIn">
              <h2 className="text-2xl font-bold text-gray-800 mb-4 px-2">景點導覽</h2>
              {spotsData.map((region, rIdx) => (
                <div key={rIdx}>
                  <h3 className="text-lg font-bold text-gray-600 mb-3 px-2 sticky top-0 bg-gray-50 py-2 z-10 backdrop-blur-sm bg-gray-50/90">{region.region}</h3>
                  <div className="space-y-3">
                    {region.spots.map((spot, sIdx) => (
                      <Card key={sIdx} className="transition-all">
                        <div 
                          className="flex justify-between items-start cursor-pointer"
                          onClick={() => setSelectedSpot(selectedSpot === spot.name ? null : spot.name)}
                        >
                          <div className="flex gap-3">
                            <div className="mt-1 text-blue-500">
                              <MapPin className="w-5 h-5" />
                            </div>
                            <div>
                              <h4 className="font-bold text-gray-800">{spot.name}</h4>
                              <p className="text-sm text-gray-500 mt-1 line-clamp-1">{spot.desc}</p>
                              <div className="flex gap-1 mt-2">
                                {spot.tags.map(tag => (
                                  <span key={tag} className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">
                                    #{tag}
                                  </span>
                                ))}
                              </div>
                            </div>
                          </div>
                          <div className="text-gray-400 mt-1">
                            {selectedSpot === spot.name ? '▲' : '▼'}
                          </div>
                        </div>
                        
                        {selectedSpot === spot.name && (
                          <div className="mt-4 pt-4 border-t border-gray-100">
                            <p className="text-gray-700 text-sm mb-4">{spot.desc}</p>
                            <button 
                              onClick={() => openMap(spot.location)}
                              className="w-full bg-blue-600 text-white py-2 rounded-lg flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors shadow-sm"
                            >
                              <ExternalLink className="w-4 h-4" /> 開啟 Google Maps 導航
                            </button>
                          </div>
                        )}
                      </Card>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        };

        const InfoView = () => (
          <div className="space-y-6 pb-20 animate-fadeIn">
            <h2 className="text-2xl font-bold text-gray-800 mb-4 px-2">重要資訊</h2>
            
            <Card className="border-l-4 border-red-500">
              <div className="flex items-center gap-2 mb-3">
                <Activity className="text-red-500 w-5 h-5" />
                <h3 className="font-bold text-lg">母親透析資訊</h3>
              </div>
              <div className="space-y-2 text-sm text-gray-700">
                <p><span className="font-bold">診所：</span>富沢あおき内科クリニック</p>
                <p><span className="font-bold">時間：</span>12/19 (五) 09:00 (08:30報到)</p>
                <p><span className="font-bold">電話：</span>022-226-7707</p>
                <div className="bg-red-50 p-3 rounded mt-2">
                  <p className="font-bold mb-1">攜帶物品：</p>
                  <ul className="list-disc list-inside space-y-1 text-gray-600">
                    <li>護照</li>
                    <li>透析病歷摘要</li>
                    <li><span className="text-red-600 font-bold">大毛巾與洗臉巾 (診所無提供)</span></li>
                    <li>止血帶、耳機、1000円鈔票</li>
                    <li>行動電源 (禁止用插座)</li>
                  </ul>
                </div>
                <button 
                  onClick={() => openMap('Tomizawa Aoki Clinic')}
                  className="w-full mt-3 bg-red-100 text-red-700 py-2 rounded flex items-center justify-center gap-2 font-bold hover:bg-red-200 transition-colors"
                >
                  <MapPin className="w-4 h-4" /> 診所導航
                </button>
              </div>
            </Card>

            <Card className="border-l-4 border-green-500">
              <div className="flex items-center gap-2 mb-3">
                <Utensils className="text-green-600 w-5 h-5" />
                <h3 className="font-bold text-lg">父親素食需求</h3>
              </div>
              <div className="p-4 bg-gray-50 rounded text-sm space-y-3">
                <p className="font-bold text-center border-b pb-2">給店員看的溝通卡</p>
                <p className="text-lg leading-relaxed font-japanese">
                  「こちらは<span className="text-red-600 font-bold">オリエンタル・ベジタリアン</span>です。」
                </p>
                <p className="text-gray-600">這位是東方素食者。</p>
                
                <p className="text-lg leading-relaxed font-japanese mt-2">
                  「<span className="font-bold">肉、魚、魚介類、出汁（カツオだし等）</span>は一切食べられません。」
                </p>
                <p className="text-gray-600">完全不吃肉、魚、海鮮、高湯(柴魚等)。</p>

                <p className="text-lg leading-relaxed font-japanese mt-2">
                  「<span className="font-bold">ネギ、玉ねぎ、ニラ、ニンニク</span>などの五葷も食べられません。」
                </p>
                <p className="text-gray-600">也不吃蔥、洋蔥、韭菜、大蒜等五辛。</p>
              </div>
            </Card>

            <Card>
              <div className="flex items-center gap-2 mb-3">
                <Phone className="text-blue-500 w-5 h-5" />
                <h3 className="font-bold text-lg">緊急聯絡</h3>
              </div>
              <div className="grid grid-cols-1 gap-3">
                 <div className="flex justify-between items-center p-2 bg-gray-50 rounded">
                    <span>警察局</span>
                    <a href="tel:110" className="font-mono font-bold text-lg text-blue-600">110</a>
                 </div>
                 <div className="flex justify-between items-center p-2 bg-gray-50 rounded">
                    <span>火警/救護車</span>
                    <a href="tel:119" className="font-mono font-bold text-lg text-red-600">119</a>
                 </div>
                 <div className="flex justify-between items-center p-2 bg-gray-50 rounded">
                    <span>外交部旅外救助</span>
                    <a href="tel:+886800085095" className="font-mono text-sm text-blue-600">0800-085-095</a>
                 </div>
              </div>
            </Card>
          </div>
        );

        function App() {
          const [activeTab, setActiveTab] = useState('itinerary');

          return (
            <div className="min-h-screen bg-gray-50 font-sans text-gray-900">
              {/* Header */}
              <div className="bg-white sticky top-0 z-40 border-b border-gray-200 px-4 py-3 shadow-sm flex items-center justify-center">
                <h1 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                  <Plane className="text-blue-500 w-5 h-5" /> 
                  日本東北孝親之旅
                </h1>
              </div>

              {/* Main Content */}
              <div className="p-4 max-w-md mx-auto">
                {activeTab === 'itinerary' && <ItineraryView />}
                {activeTab === 'transport' && <TransportView />}
                {activeTab === 'spots' && <SpotsView />}
                {activeTab === 'info' && <InfoView />}
              </div>

              {/* Navigation */}
              <Navigation activeTab={activeTab} setActiveTab={setActiveTab} />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
