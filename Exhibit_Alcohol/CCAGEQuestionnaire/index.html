<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 這一行非常重要，能確保手機版顯示正常比例 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自填式華人飲酒問題篩檢問卷</title>
    <!-- 引入 Tailwind CSS 進行快速且美觀的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 加入一些平滑顯示的動畫效果 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 py-6 sm:py-8 px-4 sm:px-6 lg:px-8 font-sans text-slate-800">
    <div class="max-w-2xl mx-auto space-y-6 sm:space-y-8">
        
        <!-- Header 區塊 -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-8 text-center">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-50 rounded-2xl mb-4 text-indigo-600">
                <i data-lucide="wine" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">
                自填式華人飲酒問題篩檢問卷
            </h1>
            <p class="text-slate-500 font-medium">C-CAGE Questionnaire</p>
            <div class="mt-6 text-left bg-slate-50 p-4 rounded-xl text-sm sm:text-base text-slate-600 leading-relaxed">
                這是一份簡單的自我篩檢問卷，幫助您了解自己的飲酒習慣是否可能對健康造成影響。請根據您過去的實際經驗，誠實地回答以下 4 個問題。
            </div>
        </div>

        <!-- 問題列表區塊 -->
        <div id="questions-container" class="space-y-4">
            <!-- JavaScript 會在這裡動態產生問題 -->
        </div>

        <!-- 送出按鈕區塊 -->
        <div id="action-container" class="flex justify-center pt-2 pb-8">
            <button
                id="submit-btn"
                onclick="handleSubmit()"
                disabled
                class="flex items-center gap-2 px-8 py-4 rounded-full font-bold text-lg transition-all duration-300 bg-slate-200 text-slate-400 cursor-not-allowed"
            >
                查看測驗結果
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- 測驗結果區塊 -->
        <div id="result-section" class="hidden bg-white rounded-3xl shadow-lg border border-slate-100 p-6 sm:p-8 mt-8 fade-in">
            <h2 class="text-2xl font-bold text-center text-slate-900 mb-8">測驗結果</h2>
            
            <div id="result-content">
                <!-- JavaScript 會根據分數替換這裡的內容 -->
            </div>

            <div class="flex justify-center mt-8">
                <button
                    onclick="handleReset()"
                    class="flex items-center gap-2 px-6 py-3 rounded-full font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors"
                >
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    重新測驗
                </button>
            </div>
        </div>

    </div>

    <script>
        // 1. 定義問題與狀態
        const questions = [
            "你曾經不想喝太多，後來卻無法控制而喝酒過量嗎？",
            "家人或朋友為你好而勸你少喝一點酒嗎？",
            "對於喝酒這件事，你會覺得不好或感到愧疚嗎？",
            "你曾經早上一起床尚未進食之前，就要喝一杯才覺得比較舒服穩定？"
        ];
        
        let answers = [null, null, null, null];

        // 2. 渲染問題列表
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = questions.map((question, index) => {
                const isAnswered = answers[index] !== null;
                const isYes = answers[index] === 'yes';
                const isNo = answers[index] === 'no';
                
                return `
                    <div class="bg-white rounded-2xl p-5 sm:p-6 transition-all duration-300 border ${isAnswered ? 'border-indigo-100 shadow-md' : 'border-slate-100 shadow-sm hover:shadow-md'}">
                        <div class="flex items-start gap-3 sm:gap-4">
                            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                                ${index + 1}
                            </div>
                            <div class="flex-grow space-y-4">
                                <h3 class="text-base sm:text-lg font-medium text-slate-800 pt-1 leading-snug">
                                    ${question}
                                </h3>
                                <div class="flex gap-3 pt-2">
                                    <button
                                        onclick="handleAnswer(${index}, 'yes')"
                                        class="flex-1 py-3 px-4 rounded-xl font-medium transition-all duration-200 border-2 ${isYes ? 'bg-indigo-600 border-indigo-600 text-white shadow-md shadow-indigo-200' : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300 hover:bg-indigo-50'}"
                                    >
                                        是
                                    </button>
                                    <button
                                        onclick="handleAnswer(${index}, 'no')"
                                        class="flex-1 py-3 px-4 rounded-xl font-medium transition-all duration-200 border-2 ${isNo ? 'bg-indigo-600 border-indigo-600 text-white shadow-md shadow-indigo-200' : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300 hover:bg-indigo-50'}"
                                    >
                                        否
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. 處理使用者作答
        window.handleAnswer = function(index, value) {
            answers[index] = value;
            renderQuestions(); // 重新渲染按鈕狀態
            checkAllAnswered(); // 檢查是否全部作答
        };

        // 4. 檢查是否全部作答完畢
        function checkAllAnswered() {
            const isAllAnswered = answers.every(answer => answer !== null);
            const submitBtn = document.getElementById('submit-btn');
            
            if (isAllAnswered) {
                submitBtn.disabled = false;
                submitBtn.className = "flex items-center gap-2 px-8 py-4 rounded-full font-bold text-lg transition-all duration-300 bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-200 transform hover:-translate-y-1";
            } else {
                submitBtn.disabled = true;
                submitBtn.className = "flex items-center gap-2 px-8 py-4 rounded-full font-bold text-lg transition-all duration-300 bg-slate-200 text-slate-400 cursor-not-allowed";
            }
        }

        // 5. 計算分數與顯示結果
        window.handleSubmit = function() {
            const score = answers.filter(answer => answer === 'yes').length;
            const resultContent = document.getElementById('result-content');
            
            if (score >= 1) {
                resultContent.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-center space-y-4">
                        <div class="inline-flex items-center justify-center p-4 bg-amber-100 rounded-full text-amber-600 mb-2">
                            <i data-lucide="alert-circle" class="w-10 h-10"></i>
                        </div>
                        <h3 class="text-xl font-bold text-amber-800">
                            需要進一步評估
                        </h3>
                        <p class="text-amber-700 text-base sm:text-lg leading-relaxed max-w-lg mx-auto">
                            根據您的回答，您對上述問題有 <strong>${score} 個</strong>回答了「是」。
                            <br class="my-2" />
                            這表示您的飲酒習慣可能已對健康或生活造成影響，<strong>建議您進一步評估飲酒習慣</strong>，或尋求專業醫師、心理諮商師的協助與評估。
                        </p>
                    </div>
                `;
            } else {
                resultContent.innerHTML = `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center space-y-4">
                        <div class="inline-flex items-center justify-center p-4 bg-emerald-100 rounded-full text-emerald-600 mb-2">
                            <i data-lucide="check-circle" class="w-10 h-10"></i>
                        </div>
                        <h3 class="text-xl font-bold text-emerald-800">
                            目前未顯示明顯風險
                        </h3>
                        <p class="text-emerald-700 text-base sm:text-lg leading-relaxed max-w-lg mx-auto">
                            根據您的回答，您目前<strong>沒有</strong>明顯的飲酒問題。
                            <br class="my-2" />
                            請繼續保持良好的健康生活方式與適度、理性的飲酒習慣！
                        </p>
                    </div>
                `;
            }

            // 隱藏按鈕區，顯示結果區
            document.getElementById('action-container').classList.add('hidden');
            const resultSection = document.getElementById('result-section');
            resultSection.classList.remove('hidden');
            
            // 重新初始化剛動態加入的 Lucide 圖示
            lucide.createIcons();
            
            // 平滑滾動到結果
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
        };

        // 6. 重新測驗
        window.handleReset = function() {
            answers = [null, null, null, null];
            renderQuestions();
            checkAllAnswered();
            
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('action-container').classList.remove('hidden');
            
            // 平滑滾動回頂端
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 初始化頁面
        renderQuestions();
        lucide.createIcons();

    </script>
</body>
</html>
