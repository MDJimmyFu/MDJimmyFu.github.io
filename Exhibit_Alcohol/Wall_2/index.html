<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>酒國聊天室</title>
    <style>
        /* CSS Reset & 變數 */
        :root {
            --ocean-dark: #1A3C4D;
            --ocean-current: #2C5F78;
            --ocean-light: #4A7A94;
            --frosted-lime: #D9E585;
            --frosted-lime-dark: #C0CD72;
            --text-white: #F0F4F8;
            --text-dark: #1A262F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* 移除點擊時的藍色高光 */
        }

        body {
            background-color: var(--ocean-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部導航列 */
        header {
            background-color: var(--ocean-current);
            color: var(--frosted-lime);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between; /* 左右對齊 */
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            height: 60px;
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
            margin: 0;
        }

        /* 重新整理按鈕樣式 */
        #refresh-btn {
            background: transparent;
            border: none;
            color: var(--frosted-lime);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            transition: background 0.2s;
        }

        #refresh-btn:active {
            background-color: rgba(217, 229, 133, 0.2);
        }

        /* 旋轉動畫 class */
        .spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 聊天訊息區域 */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* 訊息氣泡樣式 */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message-wrapper.others {
            align-self: flex-start;
        }
        
        .message-wrapper.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .nickname {
            font-size: 0.75rem;
            color: var(--ocean-light);
            margin-bottom: 4px;
            padding-left: 5px;
        }
        
        .message-wrapper.me .nickname {
            padding-right: 5px;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .others .bubble {
            background-color: #FFF;
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        .me .bubble {
            background-color: var(--frosted-lime);
            color: var(--ocean-dark);
            border-bottom-right-radius: 4px;
        }

        /* 底部輸入區域 */
        .input-area {
            background-color: var(--ocean-current);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--ocean-light);
            padding-bottom: max(10px, env(safe-area-inset-bottom)); /* 適配 iPhone 底部橫條 */
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            padding: 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
        }

        #name-input {
            width: 25%;
            min-width: 70px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--ocean-dark);
            font-weight: bold;
            text-align: center;
        }

        #msg-input {
            flex: 1;
        }

        /* 發送按鈕 */
        #send-btn {
            background-color: var(--frosted-lime);
            color: var(--ocean-dark);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            min-width: 45px; /* 防止壓縮 */
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #send-btn:active {
            background-color: var(--frosted-lime-dark);
            transform: scale(0.95);
        }

        .loading-text {
            text-align: center;
            color: var(--ocean-light);
            font-size: 0.8rem;
            padding: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 桌機適配 */
        @media (min-width: 768px) {
            body {
                background-color: #0d222e;
                align-items: center;
                justify-content: center;
            }
            .app-wrapper {
                width: 100%;
                max-width: 480px;
                height: 100vh;
                max-height: 900px;
                background-color: var(--ocean-dark);
                display: flex;
                flex-direction: column;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
                border-left: 1px solid var(--ocean-current);
                border-right: 1px solid var(--ocean-current);
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper" style="display: flex; flex-direction: column; height: 100%; width: 100%;">
        <header>
            <h1>酒國聊天室</h1>
            <!-- 新增 Refresh 按鈕 -->
            <button id="refresh-btn" title="重新整理訊息">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </header>

        <div id="chat-container">
            <div class="loading-text">請點擊右上角按鈕讀取訊息...</div>
        </div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" id="name-input" placeholder="暱稱">
                <input type="text" id="msg-input" placeholder="輸入訊息..." autocomplete="off">
                <button id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ================= 配置區域 =================
        // 請將下方的 URL 替換為你的 Google Web App URL
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby5Y9_5yicGSl7ivJtWsitHfeq6-OpEfe7O_QNVMwgduD9zQxKAE-IdD9kZE93CC-9e/exec'; 
        // ===========================================

        const chatContainer = document.getElementById('chat-container');
        const nameInput = document.getElementById('name-input');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        let isSending = false;
        let isRefreshing = false;

        // 讀取 LocalStorage 暱稱
        const savedName = localStorage.getItem('chat_nickname');
        if (savedName) nameInput.value = savedName;

        // 核心功能：讀取訊息
        async function fetchMessages() {
            if (isRefreshing) return; // 避免重複點擊
            
            try {
                // UI 狀態：開始旋轉
                isRefreshing = true;
                refreshBtn.classList.add('spinning');
                
                const response = await fetch(GAS_URL);
                const data = await response.json();
                renderMessages(data);
            } catch (error) {
                console.error('Error fetching messages:', error);
                // 可以在這裡顯示簡單的錯誤提示
                const errDiv = document.createElement('div');
                errDiv.className = 'loading-text';
                errDiv.innerText = '讀取失敗，請檢查網路';
                chatContainer.appendChild(errDiv);
            } finally {
                // UI 狀態：停止旋轉
                isRefreshing = false;
                refreshBtn.classList.remove('spinning');
            }
        }

        // 渲染畫面
        function renderMessages(messages) {
            chatContainer.innerHTML = ''; 
            const currentName = nameInput.value.trim();

            if (messages.length === 0) {
                chatContainer.innerHTML = '<div class="loading-text">目前沒有訊息</div>';
                return;
            }

            messages.forEach(msg => {
                const wrapper = document.createElement('div');
                const isMe = currentName && msg.name === currentName;
                wrapper.className = `message-wrapper ${isMe ? 'me' : 'others'}`;
                
                const nicknameDiv = document.createElement('div');
                nicknameDiv.className = 'nickname';
                nicknameDiv.textContent = msg.name;

                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'bubble';
                bubbleDiv.textContent = msg.message;

                wrapper.appendChild(nicknameDiv);
                wrapper.appendChild(bubbleDiv);
                chatContainer.appendChild(wrapper);
            });

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 核心功能：發送訊息
        async function sendMessage() {
            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();

            if (!name) {
                alert('請輸入暱稱！');
                return;
            }
            if (!msg) return;
            if (isSending) return;

            localStorage.setItem('chat_nickname', name);

            // UI 樂觀更新 (Optimistic UI)：你可以選擇先顯示訊息，但我這裡保持發送後才顯示
            // 這裡做簡單的 Loading 狀態
            msgInput.value = '';
            isSending = true;
            sendBtn.style.opacity = '0.5';

            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('message', msg);

            try {
                // 發送請求
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: formData
                });
                // 發送成功後，自動呼叫一次刷新，讓使用者看到自己剛剛傳的訊息
                await fetchMessages();
            } catch (error) {
                alert('發送失敗，請稍後再試');
                console.error(error);
            } finally {
                isSending = false;
                sendBtn.style.opacity = '1';
                msgInput.focus();
            }
        }

        // 事件監聽
        refreshBtn.addEventListener('click', fetchMessages);
        sendBtn.addEventListener('click', sendMessage);
        
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 頁面初次載入時，自動抓取一次，避免畫面空白
        fetchMessages();

    </script>
</body>
</html>
