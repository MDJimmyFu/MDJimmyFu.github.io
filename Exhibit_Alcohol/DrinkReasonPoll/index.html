<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動式投票系統</title>
    
    <!-- 1. 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 載入 React 相關核心 -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 載入 Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 基礎設定 */
        :root {
            --primary-color: #4F46E5;
            --bg-gradient-start: #EEF2FF;
            --bg-gradient-end: #E0E7FF;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            color: #1F2937;
            -webkit-tap-highlight-color: transparent;
        }

        /* 毛玻璃卡片效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 選項卡片互動 */
        .option-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        .option-item:active {
            transform: scale(0.98);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background-color: #EEF2FF;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        /* 簡單的長條圖動畫 */
        .bar-fill {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* 載入動畫 */
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 錯誤訊息容器 */
        #error-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 9999;
            padding: 20px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <!-- 錯誤顯示區 -->
    <div id="error-overlay">
        <div style="max-width: 600px; margin: 50px auto; text-align: center;">
            <div style="font-size: 50px; margin-bottom: 20px;">🤕</div>
            <h2 style="color: #DC2626; font-size: 24px; font-weight: bold; margin-bottom: 10px;">應用程式載入失敗</h2>
            <p style="color: #4B5563; margin-bottom: 20px;">無法載入必要的程式庫，請檢查您的網路連線。</p>
            <div style="text-align: left; background: #F3F4F6; padding: 15px; border-radius: 8px; overflow-x: auto;">
                <pre id="error-message" style="font-family: monospace; font-size: 12px; color: #374151;"></pre>
            </div>
            <button onclick="location.reload()" style="margin-top: 20px; background: #4F46E5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">
                重新整理頁面
            </button>
        </div>
    </div>

    <!-- React 掛載點 -->
    <div id="root"></div>

    <script>
        // 全域錯誤攔截
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errorOverlay = document.getElementById('error-overlay');
            const errorMsg = document.getElementById('error-message');
            errorOverlay.style.display = 'block';
            errorMsg.textContent = `Error: ${msg}\nLine: ${lineNo}\nStack: ${error ? error.stack : 'N/A'}`;
            return false;
        };
    </script>

    <script type="text/babel">
        // 1. 安全檢查：確保 React 已載入
        if (!window.React || !window.ReactDOM) {
            throw new Error("React library failed to load from CDN.");
        }

        const { useState, useEffect, useCallback } = window.React;

        /**
         * 系統配置區 (Configuration)
         */
        const CONFIG = {
            // true = 使用假資料測試 UI; false = 連接真實 Google Form
            // ★★★ 設定完 entryId 和 sheetCsvUrl 後，請將此改為 false 以啟用真資料 ★★★
            isDemoMode: false,

            // Google Form 設定
            // 1. Action URL (已更新為您提供的網址)
            formActionUrl: "https://docs.google.com/forms/u/0/d/e/1FAIpQLSdcCxvwE_kSef0a-NEdS_9faI38mp-At2QnWbDkukfBaeiAyQ/formResponse",
            
            // 2. Entry ID (重要！請填入您的表單問題代碼)
            // 如何取得：預覽表單 -> 右鍵檢查(Inspect) -> Network -> 填寫送出 -> 找 formResponse -> Payload -> entry.xxxxxx
            formEntryId: "entry.1500650393", 
            
            // 3. Google Sheet CSV 設定 (請填入「發布到網路」後的 CSV 連結)
            sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYAGN2ZS0B4pr52MSheAJw_kkjtkjs5W0b01kB82GlYSZDxjfQMpzWk9HowetRww4FF06IlBjWW_3P/pub?gid=331945608&single=true&output=csv",

            // UI 文字設定
            appTitle: "飲酒動機調查",
            appDesc: "請問您通常在什麼情況下會想喝酒？(可複選)",
            
            // 選項設定 (注意：label 文字必須與 Google Form 選項完全一致)
            options: [
                { id: "opt1", label: "從眾動機", desc: "喝酒不是因為我想喝，而是因為大家都在喝。", icon: "fa-users", color: "#6366F1" },
                { id: "opt2", label: "助眠動機", desc: "一杯酒，換一夜好眠？", icon: "fa-moon", color: "#4B5563" },
                { id: "opt3", label: "社交與犒賞", desc: "為了快樂，為了自己，為了更有趣的聚會！", icon: "fa-champagne-glasses", color: "#F59E0B" },
                { id: "opt4", label: "創作", desc: "微醺一點，靈感多一點。", icon: "fa-lightbulb", color: "#EC4899" },
                { id: "opt5", label: "被灌酒", desc: "朋友的壓力，杯中的酒意。", icon: "fa-face-dizzy", color: "#EF4444" },
                { id: "opt6", label: "應對動機", desc: "用酒精暫時填補心中的空洞。", icon: "fa-shield-heart", color: "#10B981" }
            ]
        };

        // 模擬資料生成器
        const generateMockData = () => {
            return CONFIG.options.map(opt => ({
                name: opt.label,
                count: Math.floor(Math.random() * 80) + 10, // 隨機票數 10~90
                color: opt.color,
                icon: opt.icon
            })).sort((a, b) => b.count - a.count);
        };

        // --- 元件：投票頁面 (支援多選) ---
        const VoteView = ({ onVote, isSubmitting }) => {
            // 改為陣列狀態，初始為空
            const [selected, setSelected] = useState([]);

            // 切換選取狀態的函式
            const toggleOption = (label) => {
                if (isSubmitting) return;
                
                setSelected(prev => {
                    if (prev.includes(label)) {
                        // 如果已選，則移除
                        return prev.filter(item => item !== label);
                    } else {
                        // 如果未選，則加入
                        return [...prev, label];
                    }
                });
            };

            return (
                <div className="space-y-6 animate-fade-in pb-8">
                    <p className="text-sm text-gray-500 text-center -mt-4 mb-2">
                        <i className="fas fa-check-double mr-1"></i> 您可以選擇多個選項
                    </p>
                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                        {CONFIG.options.map((opt) => {
                            const isSelected = selected.includes(opt.label);
                            return (
                                <div 
                                    key={opt.id}
                                    onClick={() => toggleOption(opt.label)}
                                    className={`option-item relative cursor-pointer p-4 rounded-xl flex items-center gap-4 bg-white
                                        ${isSelected ? "selected" : "border-gray-100 hover:border-indigo-200"}`}
                                >
                                    <div className="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center text-lg shadow-sm"
                                         style={{ backgroundColor: `${opt.color}15`, color: opt.color }}>
                                        <i className={`fas ${opt.icon}`}></i>
                                    </div>
                                    
                                    <div className="flex-grow">
                                        <div className="font-medium text-gray-700 text-lg leading-tight">
                                            {opt.label}
                                        </div>
                                        <div className="text-xs text-gray-400 mt-1 font-normal">
                                            {opt.desc}
                                        </div>
                                    </div>

                                    {/* 複選框 UI */}
                                    <div className={`w-6 h-6 rounded border-2 flex-shrink-0 flex items-center justify-center transition-colors
                                        ${isSelected ? "border-indigo-600 bg-indigo-600" : "border-gray-300"}`}>
                                        {isSelected && <i className="fas fa-check text-white text-xs"></i>}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <button 
                        onClick={() => selected.length > 0 && onVote(selected)}
                        disabled={selected.length === 0 || isSubmitting}
                        className={`w-full py-4 rounded-xl font-bold text-lg text-white shadow-lg transition-all flex items-center justify-center
                            ${selected.length === 0 || isSubmitting 
                                ? "bg-gray-300 cursor-not-allowed shadow-none" 
                                : "bg-indigo-600 hover:bg-indigo-700 active:scale-95 hover:shadow-indigo-500/30"}`}
                    >
                        {isSubmitting ? (
                            <>
                                <i className="fas fa-circle-notch fa-spin mr-2"></i> 處理中...
                            </>
                        ) : (
                            <>
                                送出 {selected.length} 票 <i className="fas fa-paper-plane ml-2"></i>
                            </>
                        )}
                    </button>
                </div>
            );
        };

        // --- 元件：純 CSS 統計長條圖 (取代 Recharts) ---
        const SimpleBarChart = ({ data }) => {
            const maxCount = Math.max(...data.map(d => d.count), 1); // 避免除以 0

            return (
                <div className="space-y-4">
                    {data.map((item, index) => {
                        // 計算百分比
                        const percentage = (item.count / maxCount) * 100;
                        const isWinner = index === 0 && item.count > 0;

                        return (
                            <div key={item.name} className="relative">
                                {/* Label & Value */}
                                <div className="flex justify-between items-center mb-1 text-sm">
                                    <div className="flex items-center gap-2 font-medium text-gray-700">
                                        <i className={`fas ${item.icon}`} style={{color: item.color}}></i>
                                        {item.name}
                                        {isWinner && <i className="fas fa-crown text-yellow-500 ml-1"></i>}
                                    </div>
                                    <div className="font-bold text-gray-800">
                                        {item.count} 票
                                    </div>
                                </div>
                                
                                {/* Bar Background */}
                                <div className="w-full h-4 bg-gray-100 rounded-full overflow-hidden">
                                    {/* Animated Bar */}
                                    <div 
                                        className="h-full rounded-full bar-fill"
                                        style={{ 
                                            width: `${percentage}%`,
                                            backgroundColor: item.color 
                                        }}
                                    ></div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // --- 元件：結果頁面 ---
        const ResultView = ({ data, isLoading, hasVoted, onBack }) => {
            if (isLoading) {
                return (
                    <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                        <span className="loader mb-4"></span>
                        <p>正在從雲端載入最新統計...</p>
                    </div>
                );
            }

            const totalVotes = data.reduce((acc, curr) => acc + curr.count, 0);

            return (
                <div className="space-y-6 animate-fade-in pb-8">
                    {/* 圖表區 (改用 CSS 繪製，更穩定) */}
                    <div className="bg-white rounded-2xl p-6 shadow-inner border border-gray-100">
                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4 border-b pb-2">
                            即時票數統計
                        </h3>
                        <SimpleBarChart data={data} />
                    </div>

                    {/* 數據卡片 */}
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-blue-50 p-4 rounded-xl text-center">
                            <div className="text-blue-500 text-sm mb-1 font-medium">總票數(人次)</div>
                            <div className="text-2xl font-bold text-blue-800">{totalVotes}</div>
                        </div>
                        <div className="bg-purple-50 p-4 rounded-xl text-center">
                            <div className="text-purple-500 text-sm mb-1 font-medium">最高人氣</div>
                            <div className="text-lg font-bold text-purple-800 truncate px-2">
                                {data.length > 0 ? data[0].name : "-"}
                            </div>
                        </div>
                    </div>
                    
                    {/* 按鈕區 */}
                    <div className="pt-2">
                        <button 
                            onClick={onBack}
                            className={`w-full py-3.5 rounded-xl font-medium border-2 transition-colors flex items-center justify-center gap-2
                                ${hasVoted 
                                    ? "border-gray-100 bg-gray-50 text-gray-400 cursor-not-allowed" 
                                    : "border-indigo-100 text-indigo-600 hover:bg-indigo-50 hover:border-indigo-200"}`}
                        >
                            {hasVoted ? (
                                <><span>已完成投票</span> <i className="fas fa-check"></i></>
                            ) : (
                                "返回投票頁"
                            )}
                        </button>
                        <p className="text-center mt-3 text-xs text-gray-400">
                            * 數據約有 1-2 分鐘延遲，請重新整理查看最新結果
                        </p>
                    </div>
                </div>
            );
        };

        // --- 主應用程式 ---
        const App = () => {
            const [view, setView] = useState("vote");
            const [hasVoted, setHasVoted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [chartData, setChartData] = useState([]);
            const [isLoadingResults, setIsLoadingResults] = useState(false);
            const [notification, setNotification] = useState(null);

            const showNotify = (type, msg) => {
                setNotification({ type, msg });
                setTimeout(() => setNotification(null), 3000);
            };

            // 處理多選投票
            const handleVote = async (selectedLabels) => {
                setIsSubmitting(true);
                
                try {
                    if (CONFIG.isDemoMode) {
                        await new Promise(r => setTimeout(r, 1000));
                    } else {
                        const formData = new FormData();
                        
                        // 多選的關鍵：對同一個 entryId append 多次
                        selectedLabels.forEach(label => {
                            formData.append(CONFIG.formEntryId, label);
                        });

                        await fetch(CONFIG.formActionUrl, {
                            method: "POST",
                            mode: "no-cors",
                            body: formData
                        });
                    }

                    setHasVoted(true);
                    showNotify("success", "投票成功！跳轉至結果...");
                    setTimeout(() => {
                        setView("result");
                    }, 1500);

                } catch (error) {
                    console.error(error);
                    showNotify("error", "發生錯誤，請檢查網路連線");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const fetchResults = useCallback(async () => {
                setIsLoadingResults(true);
                try {
                    let finalData = [];
                    
                    if (CONFIG.isDemoMode) {
                        await new Promise(r => setTimeout(r, 800));
                        finalData = generateMockData();
                    } else {
                        const res = await fetch(CONFIG.sheetCsvUrl);
                        if (!res.ok) throw new Error("Network response was not ok");
                        const text = await res.text();
                        
                        const rows = text.split('\n').slice(1);
                        const counts = {};
                        CONFIG.options.forEach(opt => counts[opt.label] = 0);

                        rows.forEach(row => {
                            CONFIG.options.forEach(opt => {
                                // 寬鬆比對 logic 在多選 (CSV 格式通常為 "OptionA, OptionB") 依然適用
                                if (row.includes(opt.label)) {
                                    counts[opt.label] = (counts[opt.label] || 0) + 1;
                                }
                            });
                        });

                        finalData = CONFIG.options.map(opt => ({
                            name: opt.label,
                            count: counts[opt.label] || 0,
                            color: opt.color,
                            icon: opt.icon
                        })).sort((a, b) => b.count - a.count);
                    }
                    
                    setChartData(finalData);

                } catch (e) {
                    console.error(e);
                    showNotify("error", "無法載入統計資料");
                } finally {
                    setIsLoadingResults(false);
                }
            }, []);

            useEffect(() => {
                if (view === "result") {
                    fetchResults();
                }
            }, [view, fetchResults]);

            return (
                <div className="flex flex-col items-center min-h-screen px-4 py-8 sm:justify-center">
                    
                    {notification && (
                        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-xl z-50 text-white font-medium flex items-center animate-bounce
                            ${notification.type === 'success' ? 'bg-green-500' : 'bg-red-500'}`}>
                            <i className={`fas ${notification.type === 'success' ? 'fa-check' : 'fa-exclamation-triangle'} mr-2`}></i>
                            {notification.msg}
                        </div>
                    )}

                    <div className="glass-card w-full max-w-lg rounded-3xl overflow-hidden flex flex-col relative">
                        <div className="h-2 w-full bg-gradient-to-r from-indigo-500 to-purple-500"></div>

                        <div className="p-6 sm:p-8">
                            <div className="text-center mb-8">
                                <span className="inline-block px-3 py-1 mb-3 text-xs font-bold tracking-wider text-indigo-500 bg-indigo-50 rounded-full border border-indigo-100">
                                    {CONFIG.isDemoMode ? "DEMO MODE" : "LIVE VOTING"}
                                </span>
                                <h1 className="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">{CONFIG.appTitle}</h1>
                                <p className="text-gray-500 text-sm sm:text-base">{CONFIG.appDesc}</p>
                            </div>

                            {view === "vote" ? (
                                <VoteView onVote={handleVote} isSubmitting={isSubmitting} />
                            ) : (
                                <ResultView 
                                    data={chartData} 
                                    isLoading={isLoadingResults} 
                                    hasVoted={hasVoted}
                                    onBack={() => !hasVoted && setView("vote")}
                                />
                            )}
                            
                            {view === "vote" && (
                                <div className="text-center border-t border-gray-100 pt-4">
                                    <button 
                                        onClick={() => setView("result")}
                                        className="text-sm text-gray-400 hover:text-indigo-600 transition-colors flex items-center justify-center w-full"
                                    >
                                        <i className="fas fa-chart-bar mr-1"></i> 先看目前統計結果
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="mt-8 text-center text-gray-400 text-xs">
                        <p className="mb-2">© 2026 國立台灣大學醫學人文博物館 • Powered by Google Forms</p>
                        <div className="flex flex-col sm:flex-row justify-center items-center gap-2 sm:gap-3">
                            <a href="https://mdjimmyfu.github.io/Exhibit_Alcohol/Sources/" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               className="hover:text-indigo-500 transition-colors underline decoration-dotted"
                            >
                                資料來源
                            </a>
                            <span className="hidden sm:inline text-gray-300">|</span>
                            <a href="https://mdjimmyfu.github.io/Exhibit_Alcohol/Credits/" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               className="hover:text-indigo-500 transition-colors underline decoration-dotted"
                            >
                                策展與致謝名單
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } else {
            console.error("找不到 root 節點");
        }
    </script>
</body>
</html>
