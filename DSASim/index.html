<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Brain Monitor - Burst Suppression</title>
    <style>
        :root {
            --bg-color: #000000;
            --sedline-blue: #00aaff;
            --sedline-yellow: #ffcc00;
            --bis-text: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Toolbar --- */
        #toolbar {
            height: 40px; background: #222; border-bottom: 1px solid #444;
            display: flex; align-items: center; gap: 10px; padding: 0 10px; flex-shrink: 0;
        }
        .btn {
            background: #444; border: none; color: #aaa;
            padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .btn.active-sed { background: #0055aa; color: white; }
        .btn.active-bis { background: #d4ac0d; color: black; }

        /* --- Monitor Screen (Grid) --- */
        #monitor-screen {
            flex: 1;
            background: black;
            display: grid;
            padding: 2px;
            gap: 2px;
            overflow: hidden;
            /* Default Layout defined below */
        }

        .panel {
            background: #080808; border: 1px solid #333;
            position: relative; overflow: hidden;
        }
        .panel-label {
            position: absolute; top: 2px; left: 4px;
            font-size: 10px; color: #666; pointer-events: none; z-index: 5;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .hidden { display: none !important; }

        /* --- CSS Grid Layouts --- */
        
        /* Layout 1: Sedline */
        .layout-sedline {
            grid-template-columns: 1fr;
            grid-template-rows: 25% 35% 40%;
            grid-template-areas: 
                "eeg"
                "mid"
                "dsa";
        }

        /* Layout 2: BIS */
        .layout-bis {
            grid-template-columns: 35% 65%;
            grid-template-rows: 30% 50% 20%;
            grid-template-areas: 
                "num eeg"
                "dsa dsa"
                "trend trend";
        }

        /* Grid Areas Assignment */
        #panel-eeg { grid-area: eeg; }
        #panel-dsa { grid-area: dsa; }
        #group-sedline-mid { grid-area: mid; display: flex; }
        #group-bis-num { grid-area: num; display: flex; }
        #panel-bis-trend { grid-area: trend; }

        /* --- Component Styles --- */

        /* Sedline Middle Section */
        #group-sedline-mid .sub-trend { flex: 2; border-right: 1px solid #333; position: relative; }
        #group-sedline-mid .sub-num { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
        
        .sed-psi-val { font-size: 80px; color: var(--sedline-yellow); font-weight: bold; line-height: 1; }
        .sed-label { font-size: 18px; color: var(--sedline-blue); font-weight: bold; }
        .sed-sr-box { font-size: 14px; color: #888; margin-top: 5px; font-weight: bold; }
        .sr-alert { color: #ff3333; }

        /* BIS Number Section */
        #group-bis-num { background: #111; border: 2px solid #555; border-radius: 4px; position: relative; }
        .bis-num-inner { flex: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .bis-val { font-size: 90px; color: white; font-weight: bold; line-height: 1; }
        .bis-tag { position: absolute; top: 5px; left: 5px; font-size: 16px; font-weight: bold; background: #000; padding: 0 4px; }
        
        /* BIS SR Display (Top Right of Num Box) */
        .bis-sr-container {
            position: absolute; top: 5px; right: 5px; 
            text-align: right;
        }
        .bis-sr-label { font-size: 10px; color: #aaa; }
        .bis-sr-val { font-size: 20px; font-weight: bold; color: #fff; }

        .bis-emg-col { flex: 1; border-left: 1px solid #555; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 5px; }
        .emg-bar-bg { width: 10px; height: 80%; background: #333; position: relative; }
        .emg-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #0f0, #ff0, #f00); transition: height 0.1s; }

        /* --- Controls --- */
        #controls {
            height: 160px; background: #1a1a1a; border-top: 1px solid #333;
            padding: 10px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 20px; flex-shrink: 0; overflow-y: auto;
        }
        .ctrl-row { margin-bottom: 2px; }
        .ctrl-head { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 2px; }
        input[type=range] { width: 100%; height: 4px; background: #444; -webkit-appearance: none; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #ddd; border-radius: 50%; }
        
        /* Critical Red Slider for SR */
        #slOverdose::-webkit-slider-thumb { background: #ff4444; border: 1px solid #fff; }

    </style>
</head>
<body>

<div id="toolbar">
    <button class="btn active-sed" id="btn-sed" onclick="switchMode('sedline')">Masimo Sedline</button>
    <button class="btn" id="btn-bis" onclick="switchMode('bis')">Medtronic BIS</button>
    <div style="margin-left:auto; font-size:12px; color:#666;">V3: Burst Suppression</div>
</div>

<div id="monitor-screen" class="layout-sedline">

    <!-- EEG -->
    <div class="panel" id="panel-eeg">
        <div class="panel-label" id="lbl-eeg">EEG (4-Channel)</div>
        <canvas id="cvsEEG"></canvas>
    </div>

    <!-- Sedline Middle -->
    <div class="panel" id="group-sedline-mid">
        <div class="sub-trend">
            <div class="panel-label">Trend</div>
            <canvas id="cvsTrendSed"></canvas>
        </div>
        <div class="sub-num">
            <div class="sed-label">PSI</div>
            <div class="sed-psi-val" id="valPSI">--</div>
            <div class="sed-sr-box">
                SR <span id="valSRSed">0</span> % | EMG <span id="valEMGSed">5</span>
            </div>
        </div>
    </div>

    <!-- BIS Num + SR -->
    <div class="hidden" id="group-bis-num">
        <div class="bis-num-inner">
            <div class="bis-tag">BIS</div>
            <!-- BIS SR Display -->
            <div class="bis-sr-container">
                <div class="bis-sr-label">SR</div>
                <div class="bis-sr-val" id="valSRBis">0</div>
            </div>
            
            <div class="bis-val" id="valBIS">--</div>
            <div style="font-size:12px; color:#aaa;">SQI 98</div>
        </div>
        <div class="bis-emg-col">
            <div class="emg-bar-bg"><div class="emg-bar-fill" id="barEMG"></div></div>
            <div style="font-size:10px; margin-top:5px;">EMG</div>
        </div>
    </div>

    <!-- DSA -->
    <div class="panel" id="panel-dsa">
        <div class="panel-label">DSA Spectrogram</div>
        <canvas id="cvsDSA"></canvas>
    </div>

    <!-- BIS Trend -->
    <div class="panel hidden" id="panel-bis-trend">
        <div class="panel-label">Trend</div>
        <canvas id="cvsTrendBis"></canvas>
    </div>

</div>

<div id="controls">
    <div class="ctrl-row">
        <div class="ctrl-head"><span>Delta (Deep)</span><span id="tDelta">20%</span></div>
        <input type="range" id="slDelta" min="0" max="100" value="20">
    </div>
    <div class="ctrl-row">
        <div class="ctrl-head"><span>Alpha (Sedation)</span><span id="tAlpha">0%</span></div>
        <input type="range" id="slAlpha" min="0" max="100" value="0">
    </div>
    <div class="ctrl-row">
        <div class="ctrl-head"><span>Beta (Awake)</span><span id="tBeta">50%</span></div>
        <input type="range" id="slBeta" min="0" max="100" value="50">
    </div>
    <div class="ctrl-row">
        <div class="ctrl-head"><span>Noise (EMG)</span><span id="tNoise">5%</span></div>
        <input type="range" id="slNoise" min="0" max="60" value="5">
    </div>
    <!-- New Critical Control -->
    <div class="ctrl-row" style="grid-column: span 2;">
        <div class="ctrl-head"><span style="color:#ff5555; font-weight:bold;">Anesthetic Overdose (Suppression Ratio)</span><span id="tSR" style="color:#ff5555;">0%</span></div>
        <input type="range" id="slOverdose" min="0" max="100" value="0">
    </div>
</div>

<script>
    // --- System State ---
    let mode = 'sedline';
    let params = { delta: 0.2, alpha: 0.0, beta: 0.5, noise: 0.05, suppressionLevel: 0 };
    let frame = 0;

    // Burst Suppression Logic Variables
    let isSuppressed = false; // Is the brain currently flatlining?
    let suppressionTimer = 0; // Countdown for current state
    let srHistory = new Array(60).fill(0); // For calculating average SR display
    let currentCalculatedSR = 0;

    // DOM Elements
    const container = document.getElementById('monitor-screen');
    const groupSed = document.getElementById('group-sedline-mid');
    const groupBisNum = document.getElementById('group-bis-num');
    const panelBisTrend = document.getElementById('panel-bis-trend');
    const btnSed = document.getElementById('btn-sed');
    const btnBis = document.getElementById('btn-bis');
    const lblEEG = document.getElementById('lbl-eeg');

    const ctxEEG = document.getElementById('cvsEEG').getContext('2d');
    const ctxDSA = document.getElementById('cvsDSA').getContext('2d', {willReadFrequently:true});
    const ctxTS = document.getElementById('cvsTrendSed').getContext('2d');
    const ctxTB = document.getElementById('cvsTrendBis').getContext('2d');

    const traceLen = 512;
    let traceData = new Array(traceLen).fill(0);

    // --- Init ---
    function init() {
        resizeAll();
        window.addEventListener('resize', () => setTimeout(resizeAll, 10));
        
        ['slDelta', 'slAlpha', 'slBeta', 'slNoise', 'slOverdose'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateParams);
        });
        
        updateParams();
        requestAnimationFrame(loop);
    }

    // --- Switch Logic ---
    function switchMode(m) {
        mode = m;
        if (m === 'sedline') {
            container.className = 'layout-sedline';
            groupSed.classList.remove('hidden');
            groupBisNum.classList.add('hidden');
            panelBisTrend.classList.add('hidden');
            btnSed.className = 'btn active-sed';
            btnBis.className = 'btn';
            lblEEG.innerText = "EEG (L1/L2/R1/R2)";
        } else {
            container.className = 'layout-bis';
            groupSed.classList.add('hidden');
            groupBisNum.classList.remove('hidden');
            panelBisTrend.classList.remove('hidden');
            btnSed.className = 'btn';
            btnBis.className = 'btn active-bis';
            lblEEG.innerText = "EEG (Ch1)";
        }
        setTimeout(resizeAll, 10);
    }

    function resizeAll() {
        [ctxEEG, ctxDSA, ctxTS, ctxTB].forEach(ctx => {
            const cvs = ctx.canvas;
            if(cvs.clientWidth) {
                cvs.width = cvs.clientWidth;
                cvs.height = cvs.clientHeight;
            }
        });
        ctxDSA.fillStyle = '#000'; ctxDSA.fillRect(0,0,ctxDSA.canvas.width, ctxDSA.canvas.height);
        ctxTS.fillStyle = '#000'; ctxTS.fillRect(0,0,ctxTS.canvas.width, ctxTS.canvas.height);
        ctxTB.fillStyle = '#000'; ctxTB.fillRect(0,0,ctxTB.canvas.width, ctxTB.canvas.height);
    }

    function updateParams() {
        const d = +document.getElementById('slDelta').value;
        const a = +document.getElementById('slAlpha').value;
        const b = +document.getElementById('slBeta').value;
        const n = +document.getElementById('slNoise').value;
        const sr = +document.getElementById('slOverdose').value;

        params.delta = d / 20;
        params.alpha = a / 20;
        params.beta = b / 20;
        params.noise = n / 100;
        params.suppressionLevel = sr; // 0 to 100 chance

        document.getElementById('tDelta').innerText = d + '%';
        document.getElementById('tAlpha').innerText = a + '%';
        document.getElementById('tBeta').innerText = b + '%';
        document.getElementById('tNoise').innerText = n + '%';
        document.getElementById('tSR').innerText = sr + '%';

        document.getElementById('barEMG').style.height = Math.min(100, n*1.6) + '%';
        document.getElementById('valEMGSed').innerText = n;
    }

    // --- Burst Suppression Simulation Engine ---
    function updateBurstSuppressionState() {
        // Decrease timer
        suppressionTimer--;

        // If timer is up, decide next state
        if (suppressionTimer <= 0) {
            // Target probability derived from slider
            // If slider is 60, we want approx 60% of time in suppression
            
            const targetSR = params.suppressionLevel / 100;
            
            if (params.suppressionLevel === 0) {
                isSuppressed = false;
                suppressionTimer = 100;
            } else if (params.suppressionLevel === 100) {
                isSuppressed = true;
                suppressionTimer = 100;
            } else {
                // Toggle state
                isSuppressed = !isSuppressed;
                
                // Calculate duration based on target ratio
                // Very simplified random duration
                const baseDuration = 60 + Math.random() * 60; // frames
                
                if (isSuppressed) {
                    // Duration of suppression
                    // If SR is high, Suppression should be long
                    suppressionTimer = baseDuration * (targetSR / (1-targetSR + 0.1));
                } else {
                    // Duration of burst
                    suppressionTimer = baseDuration;
                }
            }
        }
        
        // Update History for SR calculation
        // Update less frequently (e.g., every 10 frames) to simulate a moving window
        if (frame % 10 === 0) {
            srHistory.shift();
            srHistory.push(isSuppressed ? 1 : 0);
            
            // Calculate SR Value
            let sum = srHistory.reduce((a,b) => a+b, 0);
            currentCalculatedSR = Math.floor((sum / srHistory.length) * 100);
            
            // UI Update for SR
            updateSRDisplay(currentCalculatedSR);
        }
    }
    
    function updateSRDisplay(val) {
        document.getElementById('valSRSed').innerText = val;
        document.getElementById('valSRBis').innerText = val;
        
        const color = val > 0 ? '#ff3333' : '#888';
        document.getElementById('valSRSed').style.color = val > 0 ? '#ff3333' : '#aaa';
        document.getElementById('valSRBis').style.color = val > 0 ? '#ff5555' : '#fff';
    }

    // --- Main Loop ---
    function loop() {
        updateBurstSuppressionState();
        
        // 1. Generate Signal
        let val = 0;
        
        if (isSuppressed) {
            // Flatline (Isoelectric) with very minimal noise
            val = (Math.random() - 0.5) * 0.05; 
            // Add slight EMG if noise is high, even in suppression
            val += (Math.random() - 0.5) * params.noise * 2;
        } else {
            // Active Burst
            let t = frame * 0.2;
            val = (Math.sin(t) * params.delta * 2) + 
                  (Math.sin(t*8) * params.alpha * 1.5) +
                  (Math.sin(t*20) * params.beta * 0.5) +
                  ((Math.random()-0.5) * params.noise * 10);
        }

        traceData.shift();
        traceData.push(val);
        
        // 2. Draw EEG
        drawEEG();

        // 3. Draw DSA & Trend
        if (frame % 2 === 0) {
            let score = calcScore();
            updateNums(score);
            drawDSA(score);
            drawTrend(score);
        }
        
        frame++;
        requestAnimationFrame(loop);
    }
    
    function calcScore() {
        if (isSuppressed) return 0; // BIS/PSI goes to 0 during deep suppression
        
        let s = 95;
        s -= params.delta * 18;
        s -= params.alpha * 5;
        s += params.beta * 5;
        s = Math.max(0, Math.min(100, s));
        s += params.noise * 30;
        
        // If we are bursting, the score might be low (deep) but not 0
        // Weighted by overall SR
        if (currentCalculatedSR > 0) {
             s = s * (1 - (currentCalculatedSR/100));
        }
        
        return Math.floor(Math.min(100, s));
    }
    
    function updateNums(s) {
        // If SR is very high, number is close to 0
        document.getElementById('valPSI').innerText = s;
        document.getElementById('valBIS').innerText = s;
    }

    // --- Drawing ---
    function drawEEG() {
        const w = ctxEEG.canvas.width;
        const h = ctxEEG.canvas.height;
        ctxEEG.clearRect(0,0,w,h);
        ctxEEG.lineWidth = 1.5;
        
        if (mode === 'sedline') {
            const colors = ['#ffcc00', '#ffcc00', '#00aaff', '#00aaff'];
            const yOff = [0.15, 0.4, 0.65, 0.9];
            for(let ch=0; ch<4; ch++) {
                ctxEEG.beginPath();
                ctxEEG.strokeStyle = colors[ch];
                for(let i=0; i<w; i+=2) {
                    let idx = Math.floor((i/w)*traceLen);
                    // Phase offset for liveliness
                    let sig = traceData[idx];
                    let mod = Math.sin(i*0.02+ch) + sig;
                    // If suppressed, dampen the modulation too
                    if (Math.abs(sig) < 0.1) mod = sig; 
                    
                    let y = h*yOff[ch] - (mod * (h/15));
                    if(i===0) ctxEEG.moveTo(i,y); else ctxEEG.lineTo(i,y);
                }
                ctxEEG.stroke();
            }
        } else {
            ctxEEG.beginPath();
            ctxEEG.strokeStyle = '#fff';
            let mid = h/2;
            for(let i=0; i<w; i+=2) {
                let idx = Math.floor((i/w)*traceLen);
                let y = mid - (traceData[idx] * (h/10));
                if(i===0) ctxEEG.moveTo(i,y); else ctxEEG.lineTo(i,y);
            }
            ctxEEG.stroke();
        }
    }

    function drawDSA(score) {
        const cvs = ctxDSA.canvas;
        const w = cvs.width;
        const h = cvs.height;
        if(w===0) return;

        ctxDSA.drawImage(cvs, -2, 0);
        
        if (isSuppressed) {
            // Draw Black Column for Suppression
            ctxDSA.fillStyle = '#000';
            ctxDSA.fillRect(w-2, 0, 2, h);
            return; // No spectrum to draw
        }

        // Standard Spectrum
        let powerCol = [];
        for(let y=0; y<h; y++) {
            let freq = (1 - y/h) * 30; 
            let p = 0;
            if(freq < 4) p += params.delta * (2 - freq/3);
            if(freq > 8 && freq < 12) {
                let dist = Math.abs(freq-10);
                if(dist<2) p += params.alpha * 2.5 * (1-dist/2);
            }
            if(freq > 13) p += params.beta * 0.4;
            p += params.noise * 0.3 + 0.05;
            
            powerCol.push(p);
            ctxDSA.fillStyle = colorMap(p);
            ctxDSA.fillRect(w-2, y, 2, 1);
        }
        
        // Draw SEF
        let total = powerCol.reduce((a,b)=>a+b,0);
        let acc = 0, sefY = 0;
        for(let i=powerCol.length-1; i>=0; i--) {
            acc += powerCol[i];
            if(acc > total*0.95) { sefY = i; break; }
        }
        ctxDSA.fillStyle = '#fff';
        ctxDSA.fillRect(w-2, sefY, 2, 2);
    }

    function drawTrend(score) {
        const ctx = mode==='sedline' ? ctxTS : ctxTB;
        const cvs = ctx.canvas;
        if(cvs.width===0) return;

        ctx.drawImage(cvs, -1, 0);
        
        ctx.fillStyle = '#000';
        ctx.fillRect(cvs.width-1, 0, 1, cvs.height);
        
        // If suppressed, score is 0, so line goes to bottom
        let y = cvs.height * (1 - score/100);
        ctx.fillStyle = mode==='sedline' ? '#ffcc00' : '#fff';
        ctx.fillRect(cvs.width-1, y, 1, 2);
        
        // Draw SR background indicator (Light Blue or Gray)
        // If SR > 0, shade the trend background slightly
        if (currentCalculatedSR > 0) {
            let srh = (currentCalculatedSR / 100) * cvs.height;
            ctx.fillStyle = 'rgba(0, 100, 255, 0.2)'; // Blue tint for SR
            ctx.fillRect(cvs.width-1, 0, 1, srh); // Draw from top
        }
    }

    function colorMap(v) {
        v = v/2.0; if(v<0)v=0; if(v>1)v=1;
        if(mode === 'sedline') {
            if(v<0.3) return `rgb(0,0,${v*3.3*255})`;
            if(v<0.6) return `rgb(${(v-0.3)*3.3*255},0,255)`;
            if(v<0.8) return `rgb(255,${(v-0.6)*5*255},0)`;
            return `rgb(255,255,${(v-0.8)*5*255})`;
        } else {
            let h = 240 - (v*240);
            return `hsl(${h}, 100%, 50%)`;
        }
    }

    init();
</script>
</body>
</html>
