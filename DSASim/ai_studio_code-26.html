<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Monitor V19: Smooth DSA (Clinical Grade)</title>
    <style>
        :root {
            --bg-color: #000000;
            --sedline-gold: #eebb00; 
            --sedline-blue: #00aaff;
            --text-gray: #aaaaaa;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Toolbar --- */
        #toolbar {
            height: 40px; background: #111; border-bottom: 1px solid #333;
            display: flex; align-items: center; gap: 10px; padding: 0 10px; flex-shrink: 0;
            z-index: 100;
        }
        .btn {
            background: #222; border: 1px solid #444; color: #888;
            padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .btn.active-sed { background: #004488; color: white; border-color: #0088ff; }
        .btn.active-bis { background: #aa8800; color: black; border-color: #ffcc00; }
        
        .right-group { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .drug-selector { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 5px; }
        select { background: #333; color: white; border: 1px solid #444; padding: 2px 5px; border-radius: 3px; }
        
        input[type="file"] { display: none; }
        .upload-btn {
            background: #333; color: #fff; padding: 4px 10px; border-radius: 4px; 
            cursor: pointer; font-size: 12px; border: 1px solid #555; display: flex; align-items: center; gap: 5px;
        }

        /* --- Monitor Screen Grid --- */
        #monitor-screen {
            flex: 1; background: black; display: grid; padding: 2px; gap: 2px; overflow: hidden;
        }

        .panel { background: #000; position: relative; overflow: hidden; border: 1px solid #222; }
        .panel-label {
            position: absolute; top: 2px; left: 4px;
            font-size: 10px; color: #666; pointer-events: none; z-index: 5; font-weight: bold;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .hidden { display: none !important; }

        /* Layouts */
        .layout-sedline {
            grid-template-columns: 1fr;
            grid-template-rows: 25% 30% 8% 37%; 
            grid-template-areas: "eeg" "mid" "data" "dsa";
        }
        .layout-bis {
            grid-template-columns: 35% 65%;
            grid-template-rows: 30% 50% 20%; 
            grid-template-areas: "num eeg" "dsa dsa" "trend trend";
        }

        /* Areas */
        #panel-eeg { grid-area: eeg; border-bottom: 1px solid #444; }
        #group-sedline-mid { grid-area: mid; display: flex; }
        .sed-trend-container { flex: 7; position: relative; border-right: 1px solid #333; }
        .sed-num-container { flex: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(to bottom, #111, #000); }
        .sed-psi-val { font-size: 85px; color: var(--sedline-gold); font-weight: bold; line-height: 1; text-shadow: 0 0 10px rgba(238,187,0,0.3); }
        .sed-psi-label { font-size: 20px; color: #666; font-weight: bold; margin-top: -5px; }

        #group-sedline-data { grid-area: data; display: flex; align-items: center; justify-content: space-around; background: #000; border-top: 1px solid #333; border-bottom: 1px solid #333; }
        .data-item { text-align: center; }
        .data-val { font-size: 20px; font-weight: bold; color: var(--sedline-gold); }
        .data-lbl { font-size: 10px; color: #666; text-transform: uppercase; }
        .data-val.yellow { color: var(--sedline-gold); }
        .data-val.blue { color: var(--sedline-blue); }

        #panel-dsa { grid-area: dsa; position: relative; }
        .dsa-axis-label { position: absolute; right: 2px; font-size: 9px; color: #888; font-weight: bold; text-shadow: 1px 1px 0 #000; }
        .bis-labels { display: none; } 
        .sed-labels { display: block; } 

        #group-bis-num { grid-area: num; background: #111; border: 2px solid #555; display: flex; border-radius: 5px; margin: 2px;}
        .bis-inner { flex: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .bis-val-big { font-size: 90px; color: white; font-weight: bold; line-height: 1; }
        .bis-label { position: absolute; top: 5px; left: 5px; background: #000; padding: 2px 5px; font-weight: bold; }
        .bis-emg-box { flex: 1; border-left: 1px solid #555; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 5px; }
        .bis-emg-bar-bg { width: 10px; height: 80%; background: #333; position: relative; }
        .bis-emg-bar { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0f0, #ff0, #f00); transition: height 0.1s; }
        #panel-bis-trend { grid-area: trend; }

        /* --- Controls Area --- */
        #controls-area {
            height: 140px; background: #151515; border-top: 1px solid #333;
            flex-shrink: 0; position: relative;
        }
        #sim-controls {
            padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
            font-size: 11px; height: 100%; box-sizing: border-box;
        }
        .ctrl-col { display: flex; flex-direction: column; gap: 8px; }
        .slider-box { margin-bottom: 2px; }
        .slider-head { display: flex; justify-content: space-between; color: #888; margin-bottom: 2px; }
        input[type=range] { width: 100%; height: 4px; background: #444; -webkit-appearance: none; border-radius: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #ccc; border-radius: 50%; cursor: pointer; }
        #slOverdose::-webkit-slider-thumb { background: #f44; }

        #playback-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; display: none;
            flex-direction: column; justify-content: center; padding: 0 20px; box-sizing: border-box;
        }
        .pb-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .pb-title { font-size: 14px; color: #0f0; font-weight: bold; }
        .pb-time { font-size: 14px; font-family: monospace; color: #fff; }
        .pb-row-middle { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .pb-btn {
            background: #333; border: 1px solid #555; color: white; padding: 8px 15px; 
            border-radius: 4px; cursor: pointer; font-size: 16px; min-width: 40px; display: flex; justify-content: center;
        }
        .pb-btn:hover { background: #555; }
        .pb-btn.stop { background: #822; border-color: #a44; font-size: 14px; font-weight: bold;}
        .pb-speed-sel { background: #222; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px; }
        #progress-slider { width: 100%; height: 8px; background: #333; border-radius: 4px; }
        #progress-slider::-webkit-slider-thumb { width: 20px; height: 20px; background: #00aaff; border: 2px solid #fff; }

    </style>
</head>
<body>

<div id="toolbar">
    <button class="btn active-sed" id="btn-sed" onclick="setMode('sedline')">Sedline</button>
    <button class="btn" id="btn-bis" onclick="setMode('bis')">BIS</button>
    
    <div class="right-group">
        <label class="upload-btn">
            📂 Upload EDF
            <input type="file" id="fileInput" accept=".edf">
        </label>
        
        <div class="drug-selector">
            Sig: 
            <select id="drugSel" onchange="applyDrug()">
                <option value="manual">Manual/File</option>
                <option value="propofol">Propofol</option>
                <option value="sevo">Sevo</option>
                <option value="ketamine">Ketamine</option>
            </select>
        </div>
    </div>
</div>

<div id="monitor-screen" class="layout-sedline">
    <!-- EEG -->
    <div class="panel" id="panel-eeg">
        <div class="panel-label" id="lbl-eeg">EEG (L1 / R1 / L2 / R2)</div>
        <canvas id="cvsEEG"></canvas>
    </div>
    <!-- Sedline Mid -->
    <div class="panel" id="group-sedline-mid">
        <div class="sed-trend-container">
            <div class="panel-label">PSI Trend</div>
            <canvas id="cvsTrendSed"></canvas>
        </div>
        <div class="sed-num-container">
            <div class="sed-psi-val" id="valPSI">--</div>
            <div class="sed-psi-label">PSI</div>
        </div>
    </div>
    <!-- Sedline Data -->
    <div class="panel" id="group-sedline-data">
        <div class="data-item"><div class="data-val yellow" id="valEMG">0</div><div class="data-lbl">EMG %</div></div>
        <div class="data-item"><div class="data-val" id="valSR">0</div><div class="data-lbl">SR</div></div>
        <div class="data-item"><div class="data-val" id="valARTF">0</div><div class="data-lbl">ARTF %</div></div>
        <div class="data-item"><div class="data-val blue" id="valSEFL">--</div><div class="data-lbl">SEF L</div></div>
        <div class="data-item"><div class="data-val blue" id="valSEFR">--</div><div class="data-lbl">SEF R</div></div>
    </div>
    
    <!-- DSA Panel -->
    <div class="panel" id="panel-dsa">
        <div class="sed-labels">
            <div class="panel-label" style="top:2px;">DSA (Left)</div>
            <div class="panel-label" style="top:52%;">DSA (Right)</div>
            <div class="dsa-axis-label" style="top:5px;">30Hz</div>
            <div class="dsa-axis-label" style="top:45%;">0Hz</div>
            <div class="dsa-axis-label" style="top:55%;">0Hz</div>
            <div class="dsa-axis-label" style="bottom:5px;">30Hz</div>
        </div>
        <div class="bis-labels">
            <div class="panel-label" style="top:2px;">DSA</div>
            <div class="dsa-axis-label" style="top:5px;">30Hz</div>
            <div class="dsa-axis-label" style="bottom:5px;">0Hz</div>
        </div>
        <canvas id="cvsDSA"></canvas>
    </div>
    
    <!-- BIS Num/Trend -->
    <div class="hidden" id="group-bis-num">
        <div class="bis-inner"><div class="bis-label">BIS</div><div class="bis-val-big" id="valBIS">--</div><div style="font-size:12px;color:#888;">SQI 98</div></div>
        <div class="bis-emg-box"><div class="bis-emg-bar-bg"><div class="bis-emg-bar" id="barBisEMG"></div></div><div style="font-size:10px;margin-top:2px;">EMG</div></div>
    </div>
    <div class="panel hidden" id="panel-bis-trend"><div class="panel-label">Trend</div><canvas id="cvsTrendBis"></canvas></div>
</div>

<!-- Controls Area -->
<div id="controls-area">
    <div id="sim-controls">
        <div class="ctrl-col">
            <div class="slider-box"><div class="slider-head"><span>Delta (Deep)</span><span id="tD">20%</span></div><input type="range" id="slD" min="0" max="100" value="20"></div>
            <div class="slider-box"><div class="slider-head"><span>Theta (Sevo)</span><span id="tT">10%</span></div><input type="range" id="slT" min="0" max="100" value="10"></div>
        </div>
        <div class="ctrl-col">
            <div class="slider-box"><div class="slider-head"><span>Alpha (Propofol)</span><span id="tA">0%</span></div><input type="range" id="slA" min="0" max="100" value="0"></div>
            <div class="slider-box"><div class="slider-head"><span>Beta (Awake)</span><span id="tB">50%</span></div><input type="range" id="slB" min="0" max="100" value="50"></div>
        </div>
        <div class="ctrl-col">
            <div class="slider-box"><div class="slider-head"><span>Noise (EMG)</span><span id="tN">5%</span></div><input type="range" id="slN" min="0" max="60" value="5"></div>
            <div class="slider-box"><div class="slider-head"><span style="color:#f66">SR (Flatline)</span><span id="tS" style="color:#f66">0%</span></div><input type="range" id="slS" min="0" max="100" value="0"></div>
        </div>
    </div>

    <div id="playback-controls">
        <div class="pb-row-top">
            <span class="pb-title" id="pb-filename">Filename.edf</span>
            <span class="pb-time" id="pb-time-txt">00:00 / 00:00</span>
        </div>
        <div class="pb-row-middle">
            <button class="pb-btn" onclick="togglePause()" id="btn-playpause">⏸</button>
            <button class="pb-btn stop" onclick="stopPlayback()">⏹ Exit</button>
            <div style="flex:1"></div>
            <span style="font-size:12px;color:#aaa">Speed:</span>
            <select class="pb-speed-sel" id="sel-speed" onchange="changeSpeed()">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="5">5x</option>
                <option value="10">10x</option>
                <option value="30">Max</option>
            </select>
        </div>
        <input type="range" id="progress-slider" min="0" max="100" value="0" oninput="seek(this.value)">
    </div>
</div>

<script>
    // --- Global State ---
    let mode = 'sedline';
    let params = { delta:0.2, theta:0.1, alpha:0, beta:0.5, noise:0.05, sr:0 };
    let isPlayingFile = false;
    let isPaused = false;
    let fileSignals = []; 
    let playbackIdx = 0;
    let fileFs = 100;
    let fileChannels = 0;
    let playbackSpeed = 1;
    let fileTotalSamples = 0;
    let frame = 0;
    
    // Smoothing Buffers (The Key to V19)
    // Stores the spectral power of the PREVIOUS frame to average with current
    let spectrumSmoothL = new Float32Array(31).fill(0);
    let spectrumSmoothR = new Float32Array(31).fill(0);
    
    // Logic States
    let isSuppressed = false;
    let suppressTimer = 0;
    let curSR = 0;
    let srHistory = new Array(60).fill(0);
    let sefVal = 15.0;
    
    // Canvas & Contexts
    const cvsEEG = document.getElementById('cvsEEG');
    const ctxEEG = cvsEEG.getContext('2d');
    const cvsDSA = document.getElementById('cvsDSA');
    const ctxDSA = cvsDSA.getContext('2d', {willReadFrequently:true});
    const cvsTS = document.getElementById('cvsTrendSed');
    const ctxTS = cvsTS.getContext('2d');
    const cvsTB = document.getElementById('cvsTrendBis');
    const ctxTB = cvsTB.getContext('2d');

    const traceLen = 512;
    let eegBuffers = [
        new Array(traceLen).fill(0), new Array(traceLen).fill(0),
        new Array(traceLen).fill(0), new Array(traceLen).fill(0)
    ];

    // --- EDF Parsing (Mini Class) ---
    class MiniEDF {
        constructor(buffer) {
            this.view = new DataView(buffer);
            this.decoder = new TextDecoder("ascii");
            this.offset = 0;
        }
        readString(len) {
            const str = this.decoder.decode(new Uint8Array(this.view.buffer, this.offset, len));
            this.offset += len; return str.trim();
        }
        parse() {
            this.offset = 0;
            this.readString(8); // version
            this.readString(80); // pat
            this.readString(80); // rec
            this.readString(8); // date
            this.readString(8); // time
            this.headerBytes = parseInt(this.readString(8));
            this.readString(44); // reserved
            this.numRecs = parseInt(this.readString(8));
            this.durRec = parseFloat(this.readString(8));
            this.ns = parseInt(this.readString(4));
            const labels = []; for(let i=0;i<this.ns;i++) labels.push(this.readString(16));
            this.offset += this.ns * 80; // trans
            this.offset += this.ns * 8;  // dim
            const physMin = []; for(let i=0;i<this.ns;i++) physMin.push(parseFloat(this.readString(8)));
            const physMax = []; for(let i=0;i<this.ns;i++) physMax.push(parseFloat(this.readString(8)));
            const digMin = []; for(let i=0;i<this.ns;i++) digMin.push(parseInt(this.readString(8)));
            const digMax = []; for(let i=0;i<this.ns;i++) digMax.push(parseInt(this.readString(8)));
            this.offset += this.ns * 80; // prefilt
            const nsamp = []; for(let i=0;i<this.ns;i++) nsamp.push(parseInt(this.readString(8)));
            this.offset += this.ns * 32; // reserved
            const loadCh = Math.min(this.ns, 4);
            const signals = [];
            for(let i=0; i<loadCh; i++) signals.push(new Float32Array(this.numRecs * nsamp[i]));
            this.offset = this.headerBytes;
            this.fs = nsamp[0] / this.durRec;
            for(let r=0; r<this.numRecs; r++) {
                for(let s=0; s<this.ns; s++) {
                    const samps = nsamp[s];
                    if (s < loadCh) {
                        for(let k=0; k<samps; k++) {
                            const dVal = this.view.getInt16(this.offset, true); 
                            this.offset += 2;
                            const phys = (dVal - digMin[s]) * (physMax[s] - physMin[s]) / (digMax[s] - digMin[s]) + physMin[s];
                            signals[s][r*samps + k] = phys;
                        }
                    } else { this.offset += samps * 2; }
                }
            }
            return { signals, fs: this.fs };
        }
    }

    // --- V19: FFT with Temporal Smoothing ---
    function computeSpectrum(signal, fs) {
        const N = signal.length;
        const rawSpectrum = new Float32Array(31); 
        const windowed = new Float32Array(N);
        // Hanning Window
        for(let i=0; i<N; i++) windowed[i] = signal[i] * (0.5 * (1 - Math.cos(2*Math.PI*i/(N-1))));
        
        // Simple DFT for 0-30Hz
        for (let freq = 0; freq <= 30; freq++) {
            let real = 0; let imag = 0;
            const k = freq * N / fs;
            const omega = 2 * Math.PI * k / N;
            for (let n = 0; n < N; n++) {
                real += windowed[n] * Math.cos(omega * n);
                imag -= windowed[n] * Math.sin(omega * n);
            }
            rawSpectrum[freq] = Math.sqrt(real*real + imag*imag);
        }
        return rawSpectrum;
    }

    // --- V19: The Smoothing Function ---
    // alpha: 0.0 (keep old) to 1.0 (replace with new). 0.1 means slow smoothing.
    function smoothSpectrum(prevSpec, newSpec, alpha) {
        for(let i=0; i<31; i++) {
            prevSpec[i] = (prevSpec[i] * (1 - alpha)) + (newSpec[i] * alpha);
        }
        return prevSpec;
    }

    // --- Initialization ---
    function init() {
        resizeAll();
        window.addEventListener('resize', () => setTimeout(resizeAll, 50));
        
        ['slD','slT','slA','slB','slN','slS'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                document.getElementById('drugSel').value = 'manual';
                if(isPlayingFile) stopPlayback(); 
                updateParams();
            });
        });

        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        updateParams();
        requestAnimationFrame(loop);
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if(!file) return;
        e.target.value = '';
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const buffer = evt.target.result;
                const parser = new MiniEDF(buffer);
                const data = parser.parse();
                fileSignals = data.signals;
                fileFs = data.fs;
                fileChannels = fileSignals.length;
                fileTotalSamples = fileSignals[0].length;
                startPlayback(file.name);
            } catch(err) {
                alert("Error parsing EDF: " + err);
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function startPlayback(fname) {
        isPlayingFile = true; isPaused = false; playbackIdx = 0; playbackSpeed = 1;
        for(let i=0; i<4; i++) eegBuffers[i] = new Array(traceLen).fill(0);
        document.getElementById('sim-controls').style.display = 'none';
        document.getElementById('playback-controls').style.display = 'flex';
        document.getElementById('pb-filename').innerText = fname;
        document.getElementById('btn-playpause').innerText = "⏸";
        document.getElementById('sel-speed').value = "1";
        document.getElementById('drugSel').value = 'manual';
        // Reset smoothers
        spectrumSmoothL.fill(0); spectrumSmoothR.fill(0);
        updateTimeDisplay();
    }

    function stopPlayback() {
        isPlayingFile = false; isPaused = false;
        document.getElementById('playback-controls').style.display = 'none';
        document.getElementById('sim-controls').style.display = 'grid';
    }

    function togglePause() {
        if(!isPlayingFile) return;
        isPaused = !isPaused;
        document.getElementById('btn-playpause').innerText = isPaused ? "▶" : "⏸";
    }

    function changeSpeed() { playbackSpeed = parseInt(document.getElementById('sel-speed').value); }

    function seek(val) {
        if(!isPlayingFile || !fileTotalSamples) return;
        playbackIdx = Math.floor((val / 100) * fileTotalSamples);
        updateTimeDisplay();
        // Reset smoothers on seek to avoid trails
        spectrumSmoothL.fill(0); spectrumSmoothR.fill(0);
    }

    function updateTimeDisplay() {
        if(!fileFs || !fileTotalSamples) return;
        const curSec = Math.floor(playbackIdx / fileFs);
        const totSec = Math.floor(fileTotalSamples / fileFs);
        document.getElementById('pb-time-txt').innerText = `${fmtTime(curSec)} / ${fmtTime(totSec)}`;
        const pct = (playbackIdx / fileTotalSamples) * 100;
        document.getElementById('progress-slider').value = pct;
    }

    function fmtTime(s) {
        const m = Math.floor(s/60); const sec = s % 60;
        return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function resizeAll() {
        [cvsEEG, cvsDSA, cvsTS, cvsTB].forEach(c => {
            if(c.clientWidth) { c.width = c.clientWidth; c.height = c.clientHeight; }
        });
        ctxDSA.fillStyle = '#000'; ctxDSA.fillRect(0,0,cvsDSA.width, cvsDSA.height);
        ctxTS.fillStyle = '#000'; ctxTS.fillRect(0,0,cvsTS.width, cvsTS.height);
        ctxTB.fillStyle = '#000'; ctxTB.fillRect(0,0,cvsTB.width, cvsTB.height);
    }

    function setMode(m) {
        mode = m;
        const scr = document.getElementById('monitor-screen');
        const bS = document.getElementById('btn-sed');
        const bB = document.getElementById('btn-bis');
        const lblEEG = document.getElementById('lbl-eeg');
        const sedLbls = document.querySelector('.sed-labels');
        const bisLbls = document.querySelector('.bis-labels');

        if (m === 'sedline') {
            scr.className = 'layout-sedline';
            bS.className = 'btn active-sed'; bB.className = 'btn';
            document.getElementById('group-sedline-mid').classList.remove('hidden');
            document.getElementById('group-sedline-data').classList.remove('hidden');
            document.getElementById('group-bis-num').classList.add('hidden');
            document.getElementById('panel-bis-trend').classList.add('hidden');
            lblEEG.innerText = "EEG (L1 / R1 / L2 / R2)";
            sedLbls.style.display = 'block'; bisLbls.style.display = 'none';
        } else {
            scr.className = 'layout-bis';
            bS.className = 'btn'; bB.className = 'btn active-bis';
            document.getElementById('group-sedline-mid').classList.add('hidden');
            document.getElementById('group-sedline-data').classList.add('hidden');
            document.getElementById('group-bis-num').classList.remove('hidden');
            document.getElementById('panel-bis-trend').classList.remove('hidden');
            lblEEG.innerText = "EEG (Ch1)";
            sedLbls.style.display = 'none'; bisLbls.style.display = 'block';
        }
        setTimeout(resizeAll, 20);
    }

    function applyDrug() {
        if(isPlayingFile) stopPlayback();
        const d = document.getElementById('drugSel').value;
        const set = (id, v) => document.getElementById(id).value = v;
        if(d==='propofol') { set('slD',60); set('slT',5); set('slA',90); set('slB',10); set('slS',0); }
        if(d==='sevo') { set('slD',50); set('slT',60); set('slA',70); set('slB',10); set('slS',0); }
        if(d==='ketamine') { set('slD',10); set('slT',20); set('slA',10); set('slB',100); set('slS',0); }
        updateParams();
    }

    function updateParams() {
        const get = id => +document.getElementById(id).value;
        params.delta = get('slD')/20;
        params.theta = get('slT')/20;
        params.alpha = get('slA')/20;
        params.beta = get('slB')/20;
        params.noise = get('slN')/100;
        params.sr = get('slS');

        document.getElementById('tD').innerText = get('slD')+'%';
        document.getElementById('tT').innerText = get('slT')+'%';
        document.getElementById('tA').innerText = get('slA')+'%';
        document.getElementById('tB').innerText = get('slB')+'%';
        document.getElementById('tN').innerText = get('slN')+'%';
        document.getElementById('tS').innerText = get('slS')+'%';
        document.getElementById('valEMG').innerText = get('slN');
        document.getElementById('barBisEMG').style.height = Math.min(100, get('slN')*1.6)+'%';
    }

    // --- Organic Signal Generator (Stateful) ---
    // V19 Change: Make noise stateful to reduce "static"
    let bandStates = {};
    for(let ch=0; ch<4; ch++) bandStates[ch] = { delta:0, theta:0, alpha:0, beta:0 };
    
    function bandNoise(val, target, speed) {
        return val + (target - val) * speed + (Math.random()-0.5)*0.5;
    }

    function generateSimulatedSignal(ch, t) {
        if (isSuppressed) return (Math.random()-0.5) * 0.05 + (Math.random()-0.5)*params.noise*2;
        
        let st = bandStates[ch];
        
        // Pink Noise Baseline
        let pink = (Math.random()-0.5) * 0.15;

        // Delta (Wanders slowly)
        st.delta = bandNoise(st.delta, Math.sin(t*3 + ch)*2.0, 0.05);
        let delta = st.delta * params.delta;

        // Theta
        st.theta = bandNoise(st.theta, Math.sin(t*5 + ch)*1.5, 0.08);
        let theta = st.theta * params.theta;

        // Alpha (Propofol Spindles - Bursting)
        // Alpha isn't constant; it waxes and wanes
        let alphaEnv = (Math.sin(t * 1.5) + 1.2) / 2.0; 
        st.alpha = Math.sin(t*20*3.14 + ch) * alphaEnv;
        let alpha = st.alpha * params.alpha * 2.0;

        // Beta (Fast jitter)
        let beta = (Math.random()-0.5) * params.beta * 0.8;

        // EMG
        let emg = (Math.random()-0.5) * params.noise * 5.0;

        return delta + theta + alpha + beta + pink + emg;
    }

    // --- Loop ---
    function loop() {
        let currentSignalPower = [spectrumSmoothL, spectrumSmoothR]; // Use the smoothed buffers
        
        if (isPlayingFile) {
            if (!isPaused) {
                const samplesPerFrame = Math.max(1, Math.floor((fileFs / 60) * playbackSpeed));
                for(let i=0; i<samplesPerFrame; i++) {
                    if (playbackIdx >= fileSignals[0].length) playbackIdx = 0; 
                    for(let ch=0; ch<4; ch++) {
                        let val = 0;
                        if(ch < fileChannels) val = fileSignals[ch][playbackIdx];
                        else if (fileChannels > 0) val = fileSignals[0][playbackIdx];
                        eegBuffers[ch].shift(); eegBuffers[ch].push(val);
                    }
                    playbackIdx++;
                }
            }
            updateTimeDisplay();
            
            // Calculate Raw
            const rawL = computeSpectrum(eegBuffers[0].slice(-256), fileFs);
            const rawR = computeSpectrum(eegBuffers[1].slice(-256), fileFs);
            
            // V19: Apply Temporal Smoothing
            // 0.1 means "take 10% new data, keep 90% old data" -> Very smooth
            const alpha = 0.15; 
            smoothSpectrum(spectrumSmoothL, rawL, alpha);
            smoothSpectrum(spectrumSmoothR, rawR, alpha);
            
            // Re-assign for drawing
            currentSignalPower = [spectrumSmoothL, spectrumSmoothR];

        } else {
            // Simulation
            suppressTimer--;
            if(suppressTimer <= 0) {
                if(params.sr===0) { isSuppressed=false; suppressTimer=100; }
                else if(params.sr===100) { isSuppressed=true; suppressTimer=100; }
                else {
                    isSuppressed = !isSuppressed;
                    const tgt = params.sr/100;
                    suppressTimer = isSuppressed ? 60 * (tgt/(1-tgt+0.1)) : 60;
                }
            }
            
            let t = frame * (1/60.0);
            for(let ch=0; ch<4; ch++) {
                let sig = generateSimulatedSignal(ch, t);
                eegBuffers[ch].shift(); eegBuffers[ch].push(sig);
            }
            
            // For sim, we calculate power from params directly for cleaner look,
            // but applying smoothing helps transitions
            // (Sim logic handles drawing directly in drawDSA usually, 
            // but let's unify it if possible, or keep separate for cleanliness)
            currentSignalPower = "SIM"; 
        }

        if(frame%10===0) {
            let displaySR = 0;
            if(isPlayingFile) {
                sefVal = 12 + Math.random()*2; 
            } else {
                srHistory.shift(); srHistory.push(isSuppressed?1:0);
                curSR = Math.floor((srHistory.reduce((a,b)=>a+b,0)/60)*100);
                displaySR = curSR;
                if(isSuppressed) sefVal = 0;
                else {
                    if(params.beta > 1.0) sefVal = 25;
                    else if(params.alpha > 1.0) sefVal = 13;
                    else sefVal = 4 + Math.random();
                }
            }
            document.getElementById('valSR').innerText = displaySR;
            document.getElementById('valSEFL').innerText = sefVal.toFixed(1);
            document.getElementById('valSEFR').innerText = (sefVal + (Math.random()-0.5)).toFixed(1);
        }

        drawEEG();
        
        if (!isPaused && frame%2===0) {
            let score = 50; 
            if(!isPlayingFile) score = calcScoreSim();
            else score = 40 + Math.random()*5; 
            
            document.getElementById('valPSI').innerText = Math.floor(score);
            document.getElementById('valBIS').innerText = Math.floor(score);
            
            drawDSA(currentSignalPower);
            drawTrend(score);
        }
        frame++;
        requestAnimationFrame(loop);
    }
    
    function calcScoreSim() {
        if(isSuppressed) return 0;
        let s = 95;
        if (params.alpha > 1.5 && params.delta < 3.0 && params.beta < 1.0) {
            let ideal = 50; return ideal + (Math.random()-0.5)*4; 
        }
        s -= params.delta * 12; s -= params.theta * 5; s += params.beta * 10; s += params.noise * 30;
        if (params.alpha > 0) s -= params.alpha * 5;
        if(curSR>0) s *= (1 - curSR/100);
        return Math.floor(Math.max(0, Math.min(100, s)));
    }

    // --- Drawing ---
    function drawEEG() {
        const w = cvsEEG.width, h = cvsEEG.height;
        ctxEEG.clearRect(0,0,w,h); ctxEEG.lineWidth = 1;
        const colors = ['#eebb00', '#00aaff', '#eebb00', '#00aaff']; 
        const scale = isPlayingFile ? 0.3 : 1.0;

        if(mode==='sedline') {
            const yOff = [0.15, 0.4, 0.65, 0.9];
            for(let ch=0; ch<4; ch++) {
                ctxEEG.beginPath(); ctxEEG.strokeStyle = colors[ch];
                const buf = eegBuffers[ch];
                for(let i=0; i<w; i++) {
                    let idx = Math.floor((i/w)*traceLen);
                    let val = (buf[idx] !== undefined) ? buf[idx] * scale : 0;
                    let y = h*yOff[ch] - (val * (h/24)); 
                    if(i===0) ctxEEG.moveTo(i,y); else ctxEEG.lineTo(i,y);
                }
                ctxEEG.stroke();
            }
        } else {
            ctxEEG.beginPath(); ctxEEG.strokeStyle = '#fff';
            const buf = eegBuffers[0]; 
            for(let i=0; i<w; i++) {
                let idx = Math.floor((i/w)*traceLen);
                let val = (buf[idx] !== undefined) ? buf[idx] * scale : 0;
                let y = (h/2) - (val * (h/22));
                if(i===0) ctxEEG.moveTo(i,y); else ctxEEG.lineTo(i,y);
            }
            ctxEEG.stroke();
        }
    }

    function drawTrend(score) {
        const ctx = mode==='sedline' ? ctxTS : ctxTB;
        const cvs = ctx.canvas; if(!cvs.width) return;
        ctx.drawImage(cvs, -1, 0); 
        
        if(mode==='sedline') {
             ctx.fillStyle = '#000'; ctx.fillRect(cvs.width-1, 0, 1, cvs.height);
             const tTop = cvs.height*(1-0.5); const tBot = cvs.height*(1-0.25);
             ctx.fillStyle = 'rgba(0,120,0,0.8)'; ctx.fillRect(cvs.width-1, tTop, 1, tBot-tTop);
             let y = cvs.height*(1-score/100);
             ctx.fillStyle = 'rgba(238,187,0,0.6)'; ctx.fillRect(cvs.width-1, y, 1, cvs.height-y);
             ctx.fillStyle = '#fd4'; ctx.fillRect(cvs.width-1, y, 1, 1);
        } else {
             ctx.fillStyle = '#000'; ctx.fillRect(cvs.width-1, 0, 1, cvs.height);
             let y = cvs.height*(1-score/100);
             ctx.fillStyle = '#fff'; ctx.fillRect(cvs.width-1, y, 1, 2);
        }
        if(curSR>0) {
            ctx.fillStyle = 'rgba(0,100,255,0.3)';
            ctx.fillRect(cvs.width-1, 0, 1, (curSR/100)*cvs.height);
        }
    }

    function drawDSA(powerInput) {
        const w = cvsDSA.width, h = cvsDSA.height; if(!w) return;
        if(!isPaused) ctxDSA.drawImage(cvsDSA, -2, 0);
        else return;

        if(mode === 'sedline') {
            const hHalf = h/2;
            ctxDSA.fillStyle = '#222'; ctxDSA.fillRect(w-2, hHalf-1, 2, 2);
            if(!isPlayingFile && isSuppressed) {
                ctxDSA.fillStyle = '#000'; ctxDSA.fillRect(w-2, 0, 2, h); return;
            }
            if(isPlayingFile) {
                // Pass the SMOOTHED arrays
                drawSpectrumBlock(0, hHalf, powerInput[0], false);
                drawSpectrumBlock(hHalf, h, powerInput[1], true);
            } else {
                drawSimBlock(0, hHalf, 1.0, false);
                drawSimBlock(hHalf, h, 1.1, true);
            }
        } else {
            if(!isPlayingFile && isSuppressed) { ctxDSA.fillStyle='#000'; ctxDSA.fillRect(w-2,0,2,h); return; }
            if(isPlayingFile) drawSpectrumBlock(0, h, powerInput[0], false);
            else drawSimBlock(0, h, 1.0, false);
        }
    }

    function drawSpectrumBlock(yStart, yEnd, spectrum, isMirrored) {
        const height = yEnd - yStart;
        for(let y=yStart; y<yEnd; y+=2) {
            let nY = (y - yStart) / height;
            let freq = isMirrored ? nY * 30 : (1 - nY) * 30;
            let bin = Math.floor(freq); if(bin<0) bin=0; if(bin>30) bin=30;
            
            // V19: Frequency Blurring (Simulate Multitaper)
            // Average adjacent bins to reduce "stripes"
            let val = spectrum[bin];
            if(bin>0 && bin<30) val = val*0.5 + spectrum[bin-1]*0.25 + spectrum[bin+1]*0.25;
            
            val = val / 50; 
            ctxDSA.fillStyle = colorMap(val);
            ctxDSA.fillRect(cvsDSA.width-2, y, 2, 2);
        }
        drawSEFLine(yStart, yEnd, height, isMirrored);
    }
    
    function drawSimBlock(yStart, yEnd, varFact, isMirrored) {
        const height = yEnd - yStart;
        for(let y = yStart; y < yEnd; y+=2) {
            let nY = (y - yStart) / height;
            let freq = isMirrored ? nY * 30 : (1 - nY) * 30;
            let p = getSimPower(freq);
            p *= (1 + (Math.random()-0.5)*0.1*varFact); // Reduced jitter for smoothing
            ctxDSA.fillStyle = colorMap(p);
            ctxDSA.fillRect(cvsDSA.width-2, y, 2, 2);
        }
        drawSEFLine(yStart, yEnd, height, isMirrored);
    }
    
    function drawSEFLine(yStart, yEnd, height, isMirrored) {
        let sefPix;
        if (isMirrored) sefPix = yStart + (sefVal/30) * height;
        else sefPix = yStart + (1 - (sefVal/30)) * height;
        if(sefPix<yStart) sefPix=yStart; if(sefPix>yEnd) sefPix=yEnd;
        ctxDSA.fillStyle = '#fff'; ctxDSA.fillRect(cvsDSA.width-2, sefPix, 2, 2);
    }

    function getSimPower(freq) {
        let p = 0;
        if(freq < 1.0) p += params.delta * 3.0; 
        else if(freq < 4.0) p += params.delta * 1.8;
        if(freq >= 4.0 && freq < 8.0) p += params.theta * 2.0;
        if(freq >= 8.0 && freq <= 13.0) { 
            let dist = Math.abs(freq-10.5);
            if(dist < 2.5) p += params.alpha * 3.5 * (1 - dist/3.0); 
        }
        if(freq > 14.0) p += params.beta * 0.6;
        p += params.noise * 0.4 + 0.05; 
        if(freq > 4.0 && freq < 8.0 && params.theta < 0.2) p *= 0.5;
        return p;
    }

    function colorMap(v) {
        let n = v / 3.0; if (n < 0) n = 0; if (n > 1) n = 1;
        let r, g, b;
        if (n < 0.1) { r=0; g=0; b=128 + n*1280; if(b>255) b=255; } 
        else if (n < 0.35) { let t = (n - 0.1) / 0.25; r=0; g=Math.floor(t*255); b=255; } 
        else if (n < 0.6) { let t = (n - 0.35) / 0.25; r=Math.floor(t*255); g=255; b=Math.floor(255*(1-t)); } 
        else if (n < 0.85) { let t = (n - 0.6) / 0.25; r=255; g=Math.floor(255*(1-t)); b=0; } 
        else { let t = (n - 0.85) / 0.15; r=Math.floor(255 * (1 - t*0.5)); g=0; b=0; }
        return `rgb(${r},${g},${b})`;
    }

    init();
</script>
