                    <h3 className="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">連結</h3>
                    <div className="space-y-2">
                        <a href="https://www.jma.go.jp/bosai/forecast/" target="_blank" className="block p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-between">
                            <span className="flex items-center text-slate-700 dark:text-slate-200 font-medium"><Icon name="cloud-sun" className="mr-3 text-xl"/> 日本氣象廳 (JMA)</span>
                            <Icon name="arrow-square-out" className="text-slate-400 dark:text-slate-500"/>
                        </a>
                        <a href="https://www.google.com/maps" target="_blank" className="block p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-between">
                            <span className="flex items-center text-slate-700 dark:text-slate-200 font-medium"><Icon name="map-trifold" className="mr-3 text-xl"/> Google Maps</span>
                            <Icon name="arrow-square-out" className="text-slate-400 dark:text-slate-500"/>
                        </a>
                    </div>
                </section>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedEvent, setSelectedEvent] = useState(null);

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 dark:bg-slate-950 shadow-2xl overflow-hidden relative transition-colors duration-300">
                    {/* Header */}
                    <div className="bg-white dark:bg-slate-900 px-6 pt-12 pb-4 sticky top-0 z-20 shadow-sm transition-colors duration-300">
                        <div className="flex justify-between items-start">
                            <div>
                                <h1 className="text-2xl font-black text-slate-800 dark:text-white tracking-tight">東京浪漫之旅</h1>
                                <p className="text-slate-500 dark:text-slate-400 text-sm font-medium mt-1">{tripData.meta.dates} | {tripData.meta.travelers[0]} & Wife</p>
                            </div>
                            <div className="bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 p-2 rounded-full">
                                <Icon name="mountains" className="text-2xl" weight="fill"/>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main>
                        {activeTab === 'itinerary' && <ItineraryView onSelectEvent={setSelectedEvent} />}
                        {activeTab === 'backup' && <BackupView onSelectEvent={setSelectedEvent} />}
                        {activeTab === 'food' && <FoodView onSelectEvent={setSelectedEvent} />}
                        {activeTab === 'booking' && <BookingView />}
                        {activeTab === 'info' && <InfoView />}
                    </main>

                    {/* Modals */}
                    <Modal 
                        isOpen={!!selectedEvent} 
                        onClose={() => setSelectedEvent(null)}
                        event={selectedEvent}
                    />

                    {/* Navigation */}
                    <TabBar activeTab={activeTab} onTabChange={setActiveTab} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
