<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>芬蘭極光孝親之旅</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0B132B; /* Dark base for aurora */
            color: #f8fafc;
        }
        /* Hide scrollbar for horizontal scrolling but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        /* Liquid Glass Custom Classes */
        .glass-header {
            background: rgba(11, 19, 43, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-nav {
            background: rgba(11, 19, 43, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .glass-card-inner {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Animated Aurora Background */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: #060b19;
        }
        .blob {
            position: absolute;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.6;
            animation: blob-float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .blob-1 {
            top: -10%; left: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(16,185,129,0.4) 0%, rgba(0,0,0,0) 70%);
        }
        .blob-2 {
            bottom: -20%; right: -10%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(79,70,229,0.4) 0%, rgba(0,0,0,0) 70%);
            animation-delay: -5s;
        }
        .blob-3 {
            top: 40%; left: 30%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(14,165,233,0.3) 0%, rgba(0,0,0,0) 70%);
            animation-delay: -10s;
        }
        @keyframes blob-float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loadingShimmer 1.5s infinite;
        }
        @keyframes loadingShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="pb-20 antialiased relative">

    <!-- Fixed Liquid Aurora Background -->
    <div class="aurora-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Header -->
    <header class="glass-header text-white p-5 sticky top-0 z-30">
        <h1 class="text-xl font-bold flex items-center gap-2 relative z-10 tracking-wide">
            <span class="text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]">✧</span> 芬蘭極光孝親之旅
        </h1>
        <p class="text-slate-300 text-xs mt-1.5 font-medium tracking-wider relative z-10">2026/03/29 - 04/08 | 傅先生與父母</p>
    </header>

    <!-- Main Content Area -->
    <main id="app-main" class="p-4 max-w-md mx-auto md:max-w-2xl relative min-h-[70vh]">
        <!-- Content will be injected here by JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="glass-nav fixed bottom-0 w-full pb-safe z-40">
        <div class="flex justify-around items-center h-16 max-w-md mx-auto md:max-w-2xl px-2">
            <button onclick="switchTab('itinerary')" id="nav-itinerary" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-all text-emerald-400 transform scale-105">
                <i data-lucide="map" class="w-6 h-6 stroke-[2.5] drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]"></i>
                <span class="text-[10px] font-bold tracking-widest">行程</span>
            </button>
            <button onclick="switchTab('hotel')" id="nav-hotel" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-all text-slate-400 hover:text-slate-200">
                <i data-lucide="hotel" class="w-6 h-6 stroke-2"></i>
                <span class="text-[10px] font-medium tracking-widest">住宿</span>
            </button>
            <button onclick="switchTab('transport')" id="nav-transport" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-all text-slate-400 hover:text-slate-200">
                <i data-lucide="plane" class="w-6 h-6 stroke-2"></i>
                <span class="text-[10px] font-medium tracking-widest">交通</span>
            </button>
            <button onclick="switchTab('dining')" id="nav-dining" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-all text-slate-400 hover:text-slate-200">
                <i data-lucide="utensils" class="w-6 h-6 stroke-2"></i>
                <span class="text-[10px] font-medium tracking-widest">飲食</span>
            </button>
            <button onclick="switchTab('medical')" id="nav-medical" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-all text-slate-400 hover:text-slate-200">
                <i data-lucide="heart-pulse" class="w-6 h-6 stroke-2"></i>
                <span class="text-[10px] font-medium tracking-widest">醫療</span>
            </button>
        </div>
    </nav>

    <!-- Modal (Hidden by default) -->
    <div id="poi-modal" class="fixed inset-0 bg-black/40 backdrop-blur-md z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-modal rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-300 text-white" id="poi-modal-content">
            <!-- Modal Content Injected Here -->
        </div>
    </div>

    <!-- Data and Application Logic -->
    <script>
        // --- DATA: POI with Images ---
        const POI_DATABASE = {
            "novotel": { name: "台北諾富特華航桃園機場飯店", imgUrl: "https://assets.hyatt.com/content/dam/hyatt/hyattdam/images/2024/11/25/0111/TPERA-P0001-Building.jpg/TPERA-P0001-Building.4x3.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Novotel+Taipei+Taoyuan+International+Airport", features: "機場旁的五星級過境旅館，提供舒適靜謐的休息空間，方便隔日清晨從容前往航廈。", mustDo: "🛒 必買：無特殊必買，建議於房內充分休息。\n🍽️ 必吃：飯店內有品坊西餐廳，亦有簡單素食選項。", notes: "⚠️ 3/29 僅您一人入住。提供機場免費接駁車，請留意班次時刻表。" },
            "apukka": { name: "Apukka Resort (極光度假村)", imgUrl: "https://media.hostunusual.com/wp-content/uploads/2025/05/02074331/aurora%20cabin%20king%20outside%20under%20the%20northern%20lights%20at%20apukka%20resort%20rovaniemi%20lapland%20finland-1064x760.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Apukka+Resort+Rovaniemi", features: "位於羅瓦涅米郊區，遠離光害的極光觀賞絕佳地點。擁有特色玻璃屋與豐富的雪地活動。", mustDo: "📸 必看：夜晚天空的北極光。\n🍽️ 必吃：Aitta 餐廳的拉普蘭自助餐 (有溫熱素食燉菜)。", notes: "⚠️ 抵達後務必借用防寒連身衣。洗腎患者極度怕冷，請確保媽媽四肢保暖。手機務必下載 Aurora Alert Realtime APP。" },
            "apukka_daytime": { name: "Apukka 白晝極致體驗 (園區活動)", imgUrl: "https://cf.bstatic.com/xdata/images/hotel/max1024x768/806854427.jpg?k=94ff109b49b1ddf3d42c0930820903edb0e7b3fec554ea04a64674b5320235e2&o=", mapsLink: "https://www.google.com/maps/search/?api=1&query=Apukka+Resort+Rovaniemi", features: "把握退房後的 5 小時黃金空檔！度假村旁就是廣闊的結冰湖面 (Lake Olkkajärvi)，並設有哈士奇營地。", mustDo: "🐶 必看：參觀哈士奇營地，與友善的極地雪橇犬互動拍照。\n🎣 必玩：向櫃檯報名輕鬆靜態的「冰上釣魚 (Ice Fishing)」，坐在冰洞旁享受極地寧靜。\n🚶‍♂️ 散步：在安全的結冰湖面上漫步，感受北歐遼闊的純白世界。", notes: "活動皆非常靜態，不耗費體力。媽媽若想休息，大廳也有極舒適的火爐沙發區可以喝熱飲看風景。" },
            "hilton_strand": { name: "Hilton Helsinki Strand", imgUrl: "https://hravintolat.fi/wp-content/uploads/2024/04/hilton-helsinki-strand-pitkasilta1920px.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Hilton+Helsinki+Strand", features: "位於 Hakaniemi 海傍的經典五星級飯店，環境清幽且交通便利，擁有極佳的海灣視野。", mustDo: "📸 必看：行政酒廊的海灣日落。\n🍽️ 必吃：飯店北歐風自助早餐、行政酒廊 Happy Hour。", notes: "💎 善用您的鑽石卡福利，長輩若不想出門，在行政酒廊喝熱茶看風景是最棒的選擇。" },
            "lapland_hospital": { name: "Lapland Central Hospital (中央醫院)", imgUrl: "https://images.adsttc.com/media/images/681c/70cc/aad7/6200/019f/a5af/newsletter/VERSTAS_ARCHITECTS_Lapland_Central_Hospital_Extension_Niclas_M_kel__21_9741.jpg?1746694477", mapsLink: "https://www.google.com/maps/search/?api=1&query=Lapland+Central+Hospital+Rovaniemi", features: "羅瓦涅米的主要醫療中心，提供專業的血液透析服務。", mustDo: "⚠️ 醫療：抵達後請出示護照與台灣醫師開立的英文病歷/透析處方。", notes: "洗腎結束後容易虛弱，請透過護理站幫忙叫計程車返回度假村。" },
            "renalis_clinic": { name: "Renalis Suomi Pitäjänmäki 診所", imgUrl: "https://www.bookdialysis.com/storage/3737/conversions/pitajanmaki-clinic-3-profile.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Renalis+Suomi+Pitäjänmäki+Helsinki", features: "位於赫爾辛基西北住宅/商業區的專業洗腎診所。", mustDo: "⚠️ 醫療：請確認好平日與週末的報到動線是否不同。", notes: "建議使用 Taksi Helsinki App 叫車，直接設定飯店到診所的路線，避免長輩在路邊等車吹風。" },
            "tpe_airport": { name: "台灣桃園國際機場 (TPE)", imgUrl: "https://cdn.sanity.io/images/nxpteyfv/goguides/f2e575f11cb6e0c0b0049fcdd708841f025f1ec8-1600x1067.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Taoyuan+International+Airport", features: "台灣主要國際機場，提供多樣的免稅購物與餐飲服務。", mustDo: "🛒 必買：免稅店伴手禮。\n🍽️ 必吃：機場貴賓室或美食街熱食。", notes: "下午 16:25 的班機，時間充裕。與父母會合後，請協助辦理長輩的報到手續與輪椅服務（如有需要）。" },
            "nrt_airport": { name: "東京成田機場 (NRT)", imgUrl: "https://res-2.cloudinary.com/jnto/image/upload/w_2064,h_1300,c_fill,f_auto,fl_lossy,q_auto/v1668563849/chiba/Chiba_t_id264_1", mapsLink: "https://www.google.com/maps/search/?api=1&query=Narita+International+Airport", features: "去程轉機點。日本主要國際樞紐機場，轉機設施完善。", mustDo: "🛒 必買：日本伴手禮 (白色戀人、Royce生巧克力)。\n🍽️ 必吃：轉機區的熱呼呼日本拉麵或壽司。", notes: "轉機需重新經過安檢，請提醒長輩留意隨身液體規定。" },
            "hnd_airport": { name: "東京羽田機場 (HND)", imgUrl: "https://rimage.gnst.jp/livejapan.com/public/article/detail/a/00/01/a0001937/img/basic/a0001937_main.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Haneda+International+Airport+Terminal+3", features: "回程轉機點。距離東京市區極近的樞紐機場，第三航廈(T3)擁有江戶小路等豐富的餐飲區。", mustDo: "🛒 必買：各式精美和菓子與免稅品。\n🍽️ 必吃：江戶小路內的日式熱湯麵或抹茶甜點。", notes: "回程有近4小時轉機時間，非常適合讓長輩找間舒適的餐廳坐下來吃頓熱騰騰的日本料理。" },
            "hel_airport": { name: "赫爾辛基萬塔機場 (HEL)", imgUrl: "https://q-xx.bstatic.com/xdata/images/hotel/max500/417777704.jpg?k=849f0dc657accdb121b327b7731800817dca47d79d49a516d018abd02af9eac2&o=", mapsLink: "https://www.google.com/maps/search/?api=1&query=Helsinki+Airport", features: "芬蘭最大機場，以溫潤的木質北歐設計風格聞名，動線清晰。", mustDo: "🛒 必買：Moomin 嚕嚕米周邊商品。\n☕ 必吃：機場咖啡廳的道地芬蘭肉桂捲。", notes: "去程清晨抵達有約6小時轉機時間，機場內設有多處免費飲水機與舒適躺椅，可讓長輩好好休息。" },
            "rvn_airport": { name: "羅瓦涅米機場 (RVN)", imgUrl: "https://cdn.getyourguide.com/image/format=auto,fit=crop,gravity=center,quality=60,width=400,height=265,dpr=2/tour_img/f399ad8fde2d32fa.jpeg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Rovaniemi+Airport", features: "聖誕老人的官方機場！機場小巧溫馨，隨處可見聖誕老人與馴鹿的佈置。", mustDo: "📸 必看：行李轉盤區的野生動物與聖誕佈景。", notes: "機場極小，領取行李後走出大門即是接送區，Apukka 的司機會在此等候。" },
            "tsa_airport": { name: "台北松山機場 (TSA)", imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/台北松山機場.JPG/1280px-台北松山機場.JPG", mapsLink: "https://www.google.com/maps/search/?api=1&query=Taipei+Songshan+Airport", features: "位於台北市區，交通極度便利的國際機場。", mustDo: "📸 必看：三樓觀景台欣賞飛機起降。", notes: "抵達後搭乘捷運或計程車皆可極快返家，結束完美旅程。" },
            "golden_bowl": { name: "Golden Bowl Dim Sum", imgUrl: "https://santaclausvillage.info/wp-content/uploads/2023/06/IMG_2650-scaled.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Golden+Bowl+Dim+Sum+Santa+Claus+Village", features: "聖誕老人村內極少數提供亞洲熱食的餐廳，是雪地裡暖胃的救星。", mustDo: "🍽️ 必吃(素食)：提供獨立素食菜單！必點素豆腐湯麵、素餃子。\n🍽️ 必吃(大眾)：各類港式點心與熱湯麵。", notes: "非常適合爸爸，吃完熱食後才有體力繼續在雪地裡逛街。" },
            "da_zhong_hua": { name: "大中華餐廳 (Da Zhong Hua)", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKWsE9POsd_S2hm8BCpJrnk3HYn8dRlzN4HQ&s", mapsLink: "https://www.google.com/maps/search/?api=1&query=Da+Zhong+Hua+Rovaniemi", features: "羅瓦涅米當地評價極高的正宗中餐廳，口味地道。", mustDo: "🍽️ 必吃(素食)：中式炒青菜、家常豆腐熱炒。\n🍽️ 必吃(大眾)：水煮牛、宮保雞丁。", notes: "媽媽在醫院洗腎時，帶爸爸來吃頓熟悉的家鄉味最合適。" },
            "mei_lin": { name: "Mei Lin Sichuan & Vegan (美林)", imgUrl: "https://images.happycow.net/venues/1024/19/60/hcmp196037_3754429.jpeg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Mei+Lin+Sichuan+Vegan+Helsinki", features: "赫爾辛基極具盛名的四川餐廳，擁有一份極度豐富的「純素/素食專屬菜單」。", mustDo: "🍽️ 必吃(素食)：素麻婆豆腐、魚香茄子、炒上海青江菜。\n🍽️ 必吃(大眾)：正宗川味烤魚、口水雞。", notes: "長輩絕對會滿意的豐盛晚餐，強烈推薦安排在旅程後段解解鄉愁。" },
            "sen_chay": { name: "Sen Chay (全素越南料理)", imgUrl: "https://dynamic-media-cdn.tripadvisor.com/media/photo-o/08/bd/15/ea/sen-chay.jpg?w=900&h=500&s=1", mapsLink: "https://www.google.com/maps/search/?api=1&query=Sen+Chay+Helsinki", features: "100% 全素的亞洲餐廳，靠近 Hakaniemi 市場與 Hilton Strand 飯店。", mustDo: "🍽️ 必吃(素食)：越式全素河粉湯、手工素春捲。", notes: "離飯店極近，清淡溫胃，是非常沒有負擔的熱湯選擇。" },
            "arktikum": { name: "Arktikum 北極中心和拉普蘭省博物館", imgUrl: "https://upload.wikimedia.org/wikipedia/commons/6/67/ArtikumOutside.jpg", mapsLink: "https://www.google.com/maps/search/?api=1&query=Arktikum+Rovaniemi", features: "以絕美的玻璃長廊聞名，館內展示北極圈的自然生態、氣候變遷以及薩米人文化。", mustDo: "📸 必看：極光劇場與薩米人傳統服飾展。\n🛒 必買：博物館商店的北歐特色木製品。", notes: "館內溫暖、步調緩慢且設有許多休息區，非常適合長輩在媽媽洗腎空檔時參觀。" },

            "taipei": { lat: 25.0330, lon: 121.5654, name: "台北" },
            "helsinki": { lat: 60.1695, lon: 24.9354, name: "赫爾辛基" },

            "tokyo": { lat: 35.6895, lon: 139.6917, name: "東京" }
        };

        const WEATHER_CACHE = {};
        const TRIP_YEAR = 2026;

        function getWeatherMeta(code) {
            if(code === 0) return {desc: '晴朗無雲', icon: 'sun', color: 'text-yellow-400'};
            if(code === 1 || code === 2) return {desc: '晴時多雲', icon: 'cloud-sun', color: 'text-slate-300'};
            if(code === 3) return {desc: '陰天', icon: 'cloud', color: 'text-slate-400'};
            if(code >= 45 && code <= 48) return {desc: '起霧', icon: 'cloud-fog', color: 'text-slate-400'};
            if(code >= 51 && code <= 67) return {desc: '降雨', icon: 'cloud-rain', color: 'text-blue-400'};
            if(code >= 71 && code <= 77) return {desc: '降雪', icon: 'snowflake', color: 'text-blue-200'};
            if(code >= 80 && code <= 82) return {desc: '陣雨', icon: 'cloud-showers-heavy', color: 'text-blue-500'};
            if(code >= 95) return {desc: '雷陣雨', icon: 'cloud-lightning', color: 'text-purple-400'};
            return {desc: '未知', icon: 'cloud', color: 'text-slate-400'};
        }

        async function fetchDateWeather(cityKey, dayId) {
            const cacheKey = `${cityKey}_${dayId}`;
            if(WEATHER_CACHE[cacheKey]) return WEATHER_CACHE[cacheKey];
            
            const [m, d] = dayId.split('/');
            const targetDate = new Date(TRIP_YEAR, parseInt(m)-1, parseInt(d));
            
            const today = new Date();
            today.setHours(0,0,0,0);
            targetDate.setHours(0,0,0,0);

            const diffDays = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));
            const coords = CITY_COORDS[cityKey];
            const pad = (n) => n.toString().padStart(2, '0');
            
            let url = "";
            let isHistorical = false;

            if (diffDays >= 0 && diffDays <= 14) {
                const targetStr = `${TRIP_YEAR}-${pad(m)}-${pad(d)}`;
                url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset&timezone=auto&start_date=${targetStr}&end_date=${targetStr}`;
            } else {
                isHistorical = true;
                const histYear = 2025; 
                const histStr = `${histYear}-${pad(m)}-${pad(d)}`;
                url = `https://archive-api.open-meteo.com/v1/archive?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset&timezone=auto&start_date=${histStr}&end_date=${histStr}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.daily || !data.daily.time || data.daily.time.length === 0) {
                    throw new Error("No daily data returned");
                }

                const maxT = Math.round(data.daily.temperature_2m_max[0]);
                const minT = Math.round(data.daily.temperature_2m_min[0]);
                const wCode = data.daily.weather_code[0];
                const meta = getWeatherMeta(wCode);
                
                const formatTime = (isoString) => {
                    if (!isoString) return '--:--';
                    return isoString.substring(11, 16); 
                };

                const result = {
                    temp: `${minT}°C ~ ${maxT}°C`,
                    desc: meta.desc,
                    icon: meta.icon,
                    color: meta.color,
                    sunrise: formatTime(data.daily.sunrise[0]),
                    sunset: formatTime(data.daily.sunset[0]),
                    isHistorical: isHistorical,
                    histYear: isHistorical ? 2025 : null
                };
                WEATHER_CACHE[cacheKey] = result;
                return result;
            } catch(e) {
                console.error("Weather fetch failed", e);
                return { temp: '--°C', desc: '暫無資料', icon: 'cloud-off', color: 'text-slate-500', sunrise: '--:--', sunset: '--:--', isHistorical: false };
            }
        }
