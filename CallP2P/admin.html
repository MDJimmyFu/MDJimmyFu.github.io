<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叫號控制 | Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>

<body>
    <div class="container">

        <!-- Connection Screen -->
        <div id="connect-screen" class="card">
            <h1>連線至顯示器</h1>
            <div class="connection-form">
                <p style="color: var(--text-muted); margin-bottom: 1rem;">輸入顯示器上的 ID 進行連線</p>
                <input type="text" id="target-id-input" placeholder="例如: queue-xxxxx">
                <button id="connect-btn" class="primary-btn">連線 (Connect)</button>
            </div>
        </div>

        <!-- Control Panel -->
        <div id="control-panel" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="margin: 0;">目前號碼 (Remote)</h1>
                <div id="status-display" class="status-indicator">連線中...</div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="next-btn" class="primary-btn">下一號 (Next)</button>

                <div class="input-group">
                    <input type="number" id="jump-input" placeholder="#">
                    <button id="jump-btn" class="secondary-btn">跳號 (Jump)</button>
                </div>

                <button id="reset-btn" class="secondary-btn"
                    style="background: rgba(255, 59, 48, 0.2); color: #ff3b30;">重置 (Reset)</button>
            </div>
        </div>
    </div>

    <script>
        const connectScreen = document.getElementById('connect-screen');
        const controlPanel = document.getElementById('control-panel');
        const targetIdInput = document.getElementById('target-id-input');
        const connectBtn = document.getElementById('connect-btn');
        const statusDisplay = document.getElementById('status-display');

        let client = null;
        let topicCmd = '';
        let topicState = '';

        // Check for ID in URL
        const urlParams = new URLSearchParams(window.location.search);
        const autoId = urlParams.get('id');
        if (autoId) {
            targetIdInput.value = autoId;
            // Auto connect if ID is present
            setTimeout(() => connectMQ(autoId), 500);
        }

        connectBtn.addEventListener('click', () => {
            const id = targetIdInput.value.trim();
            if (id) connectMQ(id);
        });

        function connectMQ(sessionId) {
            connectBtn.innerText = '連線伺服器...';
            connectBtn.disabled = true;

            topicCmd = `queue-system/${sessionId}/cmd`;
            topicState = `queue-system/${sessionId}/state`;

            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                clientId: 'queue-client-' + Math.random().toString(16).substr(2, 8)
            });

            client.on('connect', () => {
                console.log('Connected to MQTT Broker');

                // Show control panel
                connectScreen.style.display = 'none';
                controlPanel.style.display = 'block';
                statusDisplay.innerText = '已連線 (Online)';
                statusDisplay.classList.add('connected');

                // Send HELLO to wake up display / hide QR code
                client.publish(topicCmd, 'HELLO');

                // Subscribe to state updates
                client.subscribe(topicState);
            });

            client.on('message', (topic, message) => {
                if (topic === topicState) {
                    const num = parseInt(message.toString());
                    document.getElementById('current-number').innerText = num;
                }
            });

            client.on('error', (err) => {
                console.error('Connection error:', err);
                alert('伺服器連線失敗');
                connectBtn.disabled = false;
                connectBtn.innerText = '連線 (Connect)';
            });

            client.on('offline', () => {
                statusDisplay.innerText = '離線 (Offline)';
                statusDisplay.classList.remove('connected');
            });
        }

        // Control Logic
        document.getElementById('next-btn').addEventListener('click', () => {
            if (client && client.connected) {
                client.publish(topicCmd, 'NEXT');
            }
        });

        document.getElementById('jump-btn').addEventListener('click', () => {
            const input = document.getElementById('jump-input');
            const val = parseInt(input.value);
            if (client && client.connected && !isNaN(val)) {
                client.publish(topicCmd, 'JUMP:' + val);
                input.value = '';
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (client && client.connected && confirm('確定重置？')) {
                client.publish(topicCmd, 'RESET');
            }
        });

        document.getElementById('jump-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('jump-btn').click();
        });
    </script>
</body>

</html>
