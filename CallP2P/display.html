<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目前號碼 | Queue Display</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <div id="audio-overlay">
        <div class="overlay-content">
            <div class="tap-icon">👆</div>
            <h2>點擊畫面啟用語音播報</h2>
            <p>Click anywhere to enable audio</p>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h1>目前叫號</h1>
            <div id="current-number" class="number-display">0</div>

            <div class="connection-info">
                <div id="qrcode"></div>
                <p>掃描 QR Code 或輸入 ID 連線</p>
                <div class="id-display" id="session-id-display">Generating...</div>
                <div class="status-indicator" id="connection-status">連接伺服器中...</div>
            </div>
        </div>
    </div>

    <script>
        const numberDisplay = document.getElementById('current-number');
        const audioOverlay = document.getElementById('audio-overlay');
        const sessionIdDisplay = document.getElementById('session-id-display');
        const statusIndicator = document.getElementById('connection-status');
        const connectionInfo = document.querySelector('.connection-info');
        let audioEnabled = false;
        let currentNumber = 0;
        let isConnected = false;

        // MQTT Setup
        // Generate a random Session ID
        const sessionId = 'queue-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        sessionIdDisplay.innerText = sessionId;

        // Topics
        const topicCmd = `queue-system/${sessionId}/cmd`;

        // Generate QR Code
        const adminUrl = window.location.href.replace('display.html', 'admin.html') + '?id=' + sessionId;
        new QRCode(document.getElementById("qrcode"), {
            text: adminUrl,
            width: 128,
            height: 128,
            colorDark: "#e0e0e0",
            colorLight: "#1a1a24",
            correctLevel: QRCode.CorrectLevel.M
        });

        // Connect to Public Broker (Websocket)
        // Using EMQX public broker
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'queue-display-' + Math.random().toString(16).substr(2, 8)
        });

        client.on('connect', () => {
            console.log('MQTT Connected');
            statusIndicator.innerText = '伺服器已連線，等待控制器...';
            statusIndicator.classList.add('connected');

            // Subscribe to command topic
            client.subscribe(topicCmd, (err) => {
                if (!err) {
                    console.log('Subscribed to:', topicCmd);
                }
            });
        });

        client.on('message', (topic, message) => {
            // Check if topic matches
            if (topic === topicCmd) {
                const msg = message.toString();
                console.log('Received:', msg);

                // Handle commands
                if (msg === 'NEXT') {
                    updateNumber(currentNumber + 1);
                } else if (msg === 'RESET') {
                    updateNumber(0);
                } else if (msg.startsWith('JUMP:')) {
                    const num = parseInt(msg.split(':')[1]);
                    if (!isNaN(num)) {
                        updateNumber(num);
                    }
                } else if (msg === 'HELLO') {
                    // Controller attempting to connect (handshake)
                    // We can hide the QR code now to imitate "connection established"
                    statusIndicator.innerText = '控制器已連線';
                    connectionInfo.style.display = 'none';
                    // Send back current state
                    // We don't necessarily need a return channel for this simple app, 
                    // but we can assume connection is live.
                }
            }
        });

        client.on('offline', () => {
            statusIndicator.innerText = '伺服器連線中...';
            statusIndicator.classList.remove('connected');
            connectionInfo.style.display = 'flex';
        });

        function updateNumber(num) {
            currentNumber = num;
            numberDisplay.innerText = currentNumber;

            numberDisplay.classList.remove('pulse');
            void numberDisplay.offsetWidth;
            numberDisplay.classList.add('pulse');

            playAudio(currentNumber);
        }

        function playAudio(num) {
            if (audioEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = `號碼 ${num}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        audioOverlay.addEventListener('click', () => {
            audioEnabled = true;
            audioOverlay.classList.add('hidden');
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance('');
                speechSynthesis.speak(utterance);
            }
        });
    </script>
</body>

</html>
