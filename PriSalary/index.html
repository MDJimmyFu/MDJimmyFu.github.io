<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪水核對小幫手</title>
    <!-- 引入 Tailwind CSS 快速樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定義樣式補充 */
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background-color: #e5e7eb;
            border: 1px solid #e5e7eb;
        }
        .calendar-day {
            background-color: white;
            min-height: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .calendar-day:hover { background-color: #f9fafb; }
        .calendar-day.today { background-color: #eff6ff; }
        .calendar-header {
            background-color: #f3f4f6;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            color: #4b5563;
        }
        /* 手機版優化 */
        @media (max-width: 640px) {
            .calendar-day { min-height: 80px; font-size: 0.8rem; }
            .slot-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 2px; }
            .hide-mobile { display: none; }
        }
        .modal {
            background-color: rgba(0,0,0,0.5);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="pb-20">

    <!-- 頂部導覽列 -->
    <nav class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-money-check-dollar mr-2"></i>薪水核對小幫手</h1>
            <button onclick="scrollToSettings()" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded">
                <i class="fa-solid fa-gear mr-1"></i>設定
            </button>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">

        <!-- 月份控制 -->
        <div class="flex items-center justify-between mb-4 bg-white p-4 rounded-lg shadow">
            <div class="flex items-center gap-4">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="currentMonthDisplay" class="text-2xl font-bold text-gray-800">2023年 10月</h2>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button onclick="jumpToToday()" class="text-blue-600 text-sm font-semibold hover:underline">回到今天</button>
        </div>

        <!-- 月曆區域 -->
        <div class="bg-white rounded-lg shadow overflow-hidden mb-8">
            <!-- 星期標題 -->
            <div class="grid grid-cols-7 bg-gray-50 text-center py-2 border-b">
                <div class="text-red-500 font-bold">日</div>
                <div class="font-bold">一</div>
                <div class="font-bold">二</div>
                <div class="font-bold">三</div>
                <div class="font-bold">四</div>
                <div class="font-bold">五</div>
                <div class="text-green-500 font-bold">六</div>
            </div>
            <!-- 日期網格 -->
            <div id="calendarGrid" class="calendar-grid">
                <!-- Javascript 將填充此處 -->
            </div>
        </div>

        <!-- 薪資預估總表 -->
        <div class="bg-white rounded-lg shadow p-6 mb-8 border-l-4 border-green-500">
            <h3 class="text-lg font-bold mb-4 text-gray-700"><i class="fa-solid fa-sack-dollar mr-2"></i>本月預估入帳總表</h3>
            <div id="salarySummary" class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
                <!-- Summary cards generated here -->
                <p class="text-gray-500 text-sm col-span-full">尚無資料，請點擊上方日期輸入工時。</p>
            </div>
        </div>

        <!-- 公司與銀行設定區域 -->
        <div id="settingsSection" class="bg-white rounded-lg shadow p-6 border-l-4 border-gray-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700"><i class="fa-solid fa-building mr-2"></i>公司與銀行設定</h3>
                <button onclick="openCompanyModal()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">
                    <i class="fa-solid fa-plus mr-1"></i>新增公司
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                            <th class="p-3">公司名稱</th>
                            <th class="p-3">入帳銀行</th>
                            <th class="p-3">預計入帳日</th>
                            <th class="p-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="companyListBody">
                        <!-- Company list generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== 彈窗：每日資料輸入 ===== -->
    <div id="dayModal" class="modal">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modalDateTitle">編輯日期</h3>
                <button onclick="closeModal('dayModal')" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            
            <div class="p-4 max-h-[70vh] overflow-y-auto">
                <form id="dayEntryForm">
                    <input type="hidden" id="entryDate">
                    
                    <!-- 上午 -->
                    <div class="mb-4 border p-3 rounded bg-orange-50 border-orange-200">
                        <h4 class="font-bold text-orange-700 mb-2"><i class="fa-regular fa-sun mr-1"></i>上午時段</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="col-span-2">
                                <label class="block text-xs text-gray-500">公司</label>
                                <select class="company-select w-full border rounded p-2 text-sm" id="amCompany">
                                    <option value="">(無)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500">時數(hr)</label>
                                <input type="number" step="0.5" class="w-full border rounded p-2 text-sm" id="amHours" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500">當次薪資($)</label>
                                <input type="number" class="w-full border rounded p-2 text-sm" id="amSalary" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <!-- 下午 -->
                    <div class="mb-4 border p-3 rounded bg-blue-50 border-blue-200">
                        <h4 class="font-bold text-blue-700 mb-2"><i class="fa-solid fa-sun mr-1"></i>下午時段</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="col-span-2">
                                <label class="block text-xs text-gray-500">公司</label>
                                <select class="company-select w-full border rounded p-2 text-sm" id="pmCompany">
                                    <option value="">(無)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500">時數(hr)</label>
                                <input type="number" step="0.5" class="w-full border rounded p-2 text-sm" id="pmHours" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500">當次薪資($)</label>
                                <input type="number" class="w-full border rounded p-2 text-sm" id="pmSalary" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <!-- 晚上 -->
                    <div class="mb-4 border p-3 rounded bg-indigo-50 border-indigo-200">
                        <h4 class="font-bold text-indigo-700 mb-2"><i class="fa-solid fa-moon mr-1"></i>晚上時段</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="col-span-2">
                                <label class="block text-xs text-gray-500">公司</label>
                                <select class="company-select w-full border rounded p-2 text-sm" id="nightCompany">
                                    <option value="">(無)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500">時數(hr)</label>
                                <input type="number" step="0.5" class="w-full border rounded p-2 text-sm" id="nightHours" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500">當次薪資($)</label>
                                <input type="number" class="w-full border rounded p-2 text-sm" id="nightSalary" placeholder="0">
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="p-4 border-t bg-gray-50 text-right">
                <button onclick="saveDayEntry()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow">
                    儲存資料
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 彈窗：新增/編輯公司 ===== -->
    <div id="companyModal" class="modal">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4">
            <div class="bg-gray-800 text-white p-4 flex justify-between items-center rounded-t-lg">
                <h3 class="font-bold">公司設定</h3>
                <button onclick="closeModal('companyModal')" class="text-white hover:text-gray-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6">
                <input type="hidden" id="companyId">
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">公司名稱</label>
                    <input type="text" id="companyName" class="w-full border p-2 rounded" placeholder="例如：快樂科技公司">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">入帳銀行</label>
                    <input type="text" id="companyBank" class="w-full border p-2 rounded" placeholder="例如：中國信託">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">預計入帳日 (隔月)</label>
                    <div class="relative">
                        <input type="number" id="companyPayDay" min="1" max="31" class="w-full border p-2 rounded pl-10" placeholder="例如：5">
                        <span class="absolute left-3 top-2 text-gray-500">每月</span>
                        <span class="absolute right-3 top-2 text-gray-500">號</span>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">註：填寫 5 代表工作月份的「下個月 5 號」發薪。</p>
                </div>
                <button onclick="saveCompany()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">確認儲存</button>
            </div>
        </div>
    </div>

    <script>
        // --- 全域變數與初始化 ---
        let currentDate = new Date();
        let companies = JSON.parse(localStorage.getItem('salary_app_companies')) || [];
        // 資料結構: { '2023-10-25': { am: {cid, hrs, money}, pm: {...}, night: {...} } }
        let entries = JSON.parse(localStorage.getItem('salary_app_entries')) || {};
        // 新增資料結構: { '2023-10-companyId': true }
        let receivedStatus = JSON.parse(localStorage.getItem('salary_app_received_status')) || {};

        // 初始化
        window.onload = function() {
            renderCalendar();
            renderSettings();
            updateSalarySummary();
            
            // 如果沒有公司資料，預設提示添加
            if(companies.length === 0) {
                // 自動加入一個範例公司，方便使用者上手
                companies.push({ id: generateId(), name: '範例公司', bank: '現金袋', payday: 10 });
                saveCompaniesToStorage();
                renderSettings();
            }
        };

        // --- 邏輯：月曆渲染 ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // 更新標題
            document.getElementById('currentMonthDisplay').textContent = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startDayOfWeek = firstDay.getDay(); // 0 is Sunday

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 填充前面的空白
            for(let i = 0; i < startDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day bg-gray-50 opacity-50';
                grid.appendChild(emptyCell);
            }

            // 填充日期
            for(let d = 1; d <= daysInMonth; d++) {
                const dateStr = formatDateKey(new Date(year, month, d));
                const cell = document.createElement('div');
                cell.className = 'calendar-day p-1 md:p-2 relative flex flex-col';
                if (isToday(year, month, d)) cell.classList.add('today');
                
                // 日期數字
                const dateNum = document.createElement('span');
                dateNum.className = 'text-gray-700 font-bold text-sm md:text-base mb-1';
                dateNum.textContent = d;
                cell.appendChild(dateNum);

                // 顯示當日數據摘要
                const dayData = entries[dateStr];
                if(dayData) {
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'flex flex-col gap-1 text-[10px] md:text-xs overflow-hidden';
                    
                    ['am', 'pm', 'night'].forEach(slot => {
                        if(dayData[slot] && dayData[slot].companyId) {
                            const cName = getCompanyName(dayData[slot].companyId);
                            const money = dayData[slot].salary;
                            // 電腦版顯示文字
                            const tag = document.createElement('div');
                            tag.className = `truncate rounded px-1 text-white ${getSlotColor(slot)}`;
                            tag.innerHTML = `<span class="hidden md:inline">${getSlotIcon(slot)} ${cName} $${money}</span>`;
                            // 手機版只顯示一個點或極簡符號
                            const mobileDot = document.createElement('span');
                            mobileDot.className = `md:hidden w-2 h-2 rounded-full inline-block mr-1 ${getSlotColorBg(slot)}`;
                            
                            // 為了手機版佈局，這裡做一點特別處理
                            if(window.innerWidth < 768) {
                                // 手機版用點點表示
                                dateNum.appendChild(mobileDot);
                            } else {
                                contentDiv.appendChild(tag);
                            }
                        }
                    });
                    
                    // 手機版如果有點點，就不append contentDiv，或者只顯示總金額?
                    // 簡單處理：電腦版顯示詳細，手機版點擊看詳情，只在日期旁邊打點
                    if(window.innerWidth >= 768) {
                        cell.appendChild(contentDiv);
                    } else {
                         // 計算當日總額顯示在手機版
                         let dailyTotal = 0;
                         ['am', 'pm', 'night'].forEach(s => {
                             if(dayData[s] && dayData[s].salary) dailyTotal += parseFloat(dayData[s].salary);
                         });
                         if(dailyTotal > 0) {
                             const totalLabel = document.createElement('div');
                             totalLabel.className = 'text-blue-600 text-[10px] font-bold mt-auto';
                             totalLabel.textContent = `$${dailyTotal}`;
                             cell.appendChild(totalLabel);
                         }
                    }
                }

                cell.onclick = () => openDayModal(dateStr);
                grid.appendChild(cell);
            }
        }

        // --- 邏輯：彈窗與資料輸入 ---
        function openDayModal(dateStr) {
            document.getElementById('entryDate').value = dateStr;
            const [y, m, d] = dateStr.split('-');
            document.getElementById('modalDateTitle').textContent = `編輯 ${y}年${m}月${d}日 資料`;

            // 填充下拉選單
            updateCompanySelects();

            // 讀取既有資料
            const data = entries[dateStr] || {};
            
            fillSlotForm('am', data.am);
            fillSlotForm('pm', data.pm);
            fillSlotForm('night', data.night);

            openModal('dayModal');
        }

        function fillSlotForm(slot, data) {
            document.getElementById(`${slot}Company`).value = data ? data.companyId : "";
            document.getElementById(`${slot}Hours`).value = data ? data.hours : "";
            document.getElementById(`${slot}Salary`).value = data ? data.salary : "";
        }

        function saveDayEntry() {
            const dateStr = document.getElementById('entryDate').value;
            const entryData = {
                am: getSlotData('am'),
                pm: getSlotData('pm'),
                night: getSlotData('night')
            };

            // 如果整天都空的，刪除該 key 以節省空間
            if (!entryData.am && !entryData.pm && !entryData.night) {
                delete entries[dateStr];
            } else {
                entries[dateStr] = entryData;
            }

            localStorage.setItem('salary_app_entries', JSON.stringify(entries));
            closeModal('dayModal');
            renderCalendar(); // 重繪月曆
            updateSalarySummary(); // 更新總表
        }

        function getSlotData(slot) {
            const cid = document.getElementById(`${slot}Company`).value;
            const hrs = document.getElementById(`${slot}Hours`).value;
            const sal = document.getElementById(`${slot}Salary`).value;
            
            if(!cid && !hrs && !sal) return null; // 空資料
            return {
                companyId: cid,
                hours: hrs,
                salary: sal
            };
        }

        // --- 邏輯：薪資統計總表 ---
        function updateSalarySummary() {
            const container = document.getElementById('salarySummary');
            container.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1; // 1-12
            const prefix = `${year}-${String(month).padStart(2, '0')}`;

            // 1. 篩選本月資料
            const monthlyStats = {}; // { companyId: { totalSalary: 0, totalHours: 0 } }

            Object.keys(entries).forEach(dateKey => {
                if(dateKey.startsWith(prefix)) {
                    const dayData = entries[dateKey];
                    ['am', 'pm', 'night'].forEach(slot => {
                        const sData = dayData[slot];
                        if(sData && sData.companyId) {
                            if(!monthlyStats[sData.companyId]) {
                                monthlyStats[sData.companyId] = { totalSalary: 0, totalHours: 0 };
                            }
                            monthlyStats[sData.companyId].totalSalary += parseFloat(sData.salary || 0);
                            monthlyStats[sData.companyId].totalHours += parseFloat(sData.hours || 0);
                        }
                    });
                }
            });

            // 2. 顯示卡片
            if(Object.keys(monthlyStats).length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-4">本月尚無工作紀錄</p>';
                return;
            }

            Object.keys(monthlyStats).forEach(cid => {
                const comp = companies.find(c => c.id == cid);
                const stat = monthlyStats[cid];
                if(!comp) return; // 公司可能被刪除了

                // 計算入帳日：下個月 X 號
                let nextMonth = month + 1;
                let nextYear = year;
                if(nextMonth > 12) { nextMonth = 1; nextYear++; }
                
                // 檢查是否已入帳
                const statusKey = `${year}-${String(month).padStart(2, '0')}-${cid}`;
                const isReceived = receivedStatus[statusKey];

                // 根據狀態設定樣式
                const cardClass = isReceived ? 'bg-green-50 border-green-300' : 'bg-gray-50 border-gray-200';
                const btnClass = isReceived 
                    ? 'bg-green-600 hover:bg-green-700 text-white' 
                    : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-100';
                const btnText = isReceived ? '<i class="fa-solid fa-check mr-1"></i>已入帳' : '確認入帳';
                const textClass = isReceived ? 'text-green-800' : 'text-gray-800';

                const card = document.createElement('div');
                card.className = `${cardClass} border rounded p-4 flex flex-col justify-between transition-colors duration-300`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold ${textClass} text-lg">${comp.name}</h4>
                            ${isReceived ? '<span class="text-xs font-bold text-green-600 border border-green-600 px-1 rounded">PAID</span>' : ''}
                        </div>
                        <div class="text-sm text-gray-500 mt-1">
                            <i class="fa-solid fa-building-columns mr-1"></i> ${comp.bank || '未設定'}
                        </div>
                        <div class="text-sm text-gray-500">
                            <i class="fa-regular fa-calendar-check mr-1"></i> 預計入帳：${nextYear}/${nextMonth}/${comp.payday}
                        </div>
                        <div class="text-sm text-gray-500 mt-1">
                            <i class="fa-regular fa-clock mr-1"></i> 總時數：${stat.totalHours} hr
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-200/50">
                        <div class="flex justify-between items-end">
                            <button onclick="toggleReceived('${statusKey}')" class="text-xs px-3 py-1.5 rounded shadow-sm transition-colors ${btnClass}">
                                ${btnText}
                            </button>
                            <div class="text-right">
                                <span class="text-xs text-gray-500">應領薪資</span>
                                <div class="text-2xl font-bold ${isReceived ? 'text-green-700' : 'text-gray-700'}">$${stat.totalSalary.toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleReceived(key) {
            if (receivedStatus[key]) {
                delete receivedStatus[key];
            } else {
                receivedStatus[key] = true;
            }
            localStorage.setItem('salary_app_received_status', JSON.stringify(receivedStatus));
            updateSalarySummary();
        }

        // --- 邏輯：公司設定 ---
        function renderSettings() {
            const tbody = document.getElementById('companyListBody');
            tbody.innerHTML = '';
            
            companies.forEach(comp => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 font-medium">${comp.name}</td>
                    <td class="p-3 text-gray-600">${comp.bank}</td>
                    <td class="p-3 text-gray-600">次月 ${comp.payday} 號</td>
                    <td class="p-3 text-right">
                        <button onclick="editCompany('${comp.id}')" class="text-blue-600 hover:text-blue-800 mr-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteCompany('${comp.id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            updateCompanySelects();
        }

        function openCompanyModal(id = null) {
            document.getElementById('companyId').value = id || '';
            document.getElementById('companyName').value = '';
            document.getElementById('companyBank').value = '';
            document.getElementById('companyPayDay').value = '';
            
            if(id) {
                const comp = companies.find(c => c.id == id);
                if(comp) {
                    document.getElementById('companyName').value = comp.name;
                    document.getElementById('companyBank').value = comp.bank;
                    document.getElementById('companyPayDay').value = comp.payday;
                }
            }
            openModal('companyModal');
        }

        function saveCompany() {
            const id = document.getElementById('companyId').value;
            const name = document.getElementById('companyName').value;
            const bank = document.getElementById('companyBank').value;
            const payday = document.getElementById('companyPayDay').value;

            if(!name) { alert('請輸入公司名稱'); return; }

            if(id) {
                // 編輯
                const idx = companies.findIndex(c => c.id == id);
                if(idx > -1) {
                    companies[idx] = { id, name, bank, payday };
                }
            } else {
                // 新增
                companies.push({ id: generateId(), name, bank, payday });
            }

            saveCompaniesToStorage();
            closeModal('companyModal');
            renderSettings();
            renderCalendar(); // 公司名稱可能改變
            updateSalarySummary();
        }

        function deleteCompany(id) {
            if(confirm('確定要刪除這間公司嗎？這不會刪除已輸入的歷史薪資紀錄，但總表可能無法顯示該公司名稱。')) {
                companies = companies.filter(c => c.id != id);
                saveCompaniesToStorage();
                renderSettings();
                renderCalendar();
                updateSalarySummary();
            }
        }

        function updateCompanySelects() {
            const selects = document.querySelectorAll('.company-select');
            selects.forEach(sel => {
                const currentVal = sel.value;
                sel.innerHTML = '<option value="">(無)</option>';
                companies.forEach(comp => {
                    const opt = document.createElement('option');
                    opt.value = comp.id;
                    opt.textContent = comp.name;
                    sel.appendChild(opt);
                });
                sel.value = currentVal;
            });
        }

        // --- 工具函式 ---
        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
            updateSalarySummary();
        }

        function jumpToToday() {
            currentDate = new Date();
            renderCalendar();
            updateSalarySummary();
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isToday(y, m, d) {
            const today = new Date();
            return today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function getCompanyName(id) {
            const c = companies.find(x => x.id == id);
            return c ? c.name : '未知公司';
        }

        function getSlotColor(slot) {
            if(slot === 'am') return 'bg-orange-400';
            if(slot === 'pm') return 'bg-blue-400';
            return 'bg-indigo-500';
        }
        
        function getSlotColorBg(slot) {
             if(slot === 'am') return 'bg-orange-400';
            if(slot === 'pm') return 'bg-blue-400';
            return 'bg-indigo-500';
        }

        function getSlotIcon(slot) {
            if(slot === 'am') return '<i class="fa-regular fa-sun text-[10px]"></i>';
            if(slot === 'pm') return '<i class="fa-solid fa-sun text-[10px]"></i>';
            return '<i class="fa-solid fa-moon text-[10px]"></i>';
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function scrollToSettings() {
            document.getElementById('settingsSection').scrollIntoView({ behavior: 'smooth' });
        }

        function saveCompaniesToStorage() {
            localStorage.setItem('salary_app_companies', JSON.stringify(companies));
        }
        
        // 編輯既有公司
        window.editCompany = function(id) {
            openCompanyModal(id);
        }
    </script>
</body>
</html>
